<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commission Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F7F9FA; --card:#FFFFFF; --card-2:#FCFDFD; --line:#E4E8EB; --line-2:#D3D8DB;
  --ink:#2B363B; --ink-strong:#172024; --num:#222C31; --ink-2:#424B4F;
  --muted:#777D80; --muted-2:#878F94; --faint:#C7CED4;
  --accent:#545CFF; --accent-2:#4C4FD9; --accent-soft:#D3D5FC; --accent-wash:#F0F1FF;
  --c1:#4C4FD9; --c2:#00967F; --c3:#D8604A; --c4:#8B4FD0; --c5:#A6780F;
  --good:#00967F; --warn:#A6780F; --crit:#D8604A; --neg:#D63B78;
  --good-wash:#E5F4F1; --warn-wash:#FBF2DF; --crit-wash:#FBEAE6; --neutral-wash:#EFF2F4;
  --shadow:0 2px 8px var(--line);
  --grid:#EDF1F3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --card:#141B22; --card-2:#182028; --line:#26303A; --line-2:#37444F;
    --ink:#E6ECF1; --ink-strong:#F4F7FA; --num:#F4F7FA; --ink-2:#B7C2CC;
    --muted:#8B97A3; --muted-2:#77838F; --faint:#3B4854;
    --accent:#8B90FF; --accent-2:#6E73EC; --accent-soft:#2C3157; --accent-wash:#1A2032;
    --c1:#6E73EC; --c2:#0AA98F; --c3:#DE6A52; --c4:#A169DC; --c5:#B98C2A;
    --good:#0AA98F; --warn:#B98C2A; --crit:#DE6A52; --neg:#E86BA0;
    --good-wash:#0F2C28; --warn-wash:#2C2416; --crit-wash:#301C18; --neutral-wash:#1C242C;
    --shadow:0 2px 10px rgba(0,0,0,.55);
    --grid:#222C35;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --card:#141B22; --card-2:#182028; --line:#26303A; --line-2:#37444F;
  --ink:#E6ECF1; --ink-strong:#F4F7FA; --num:#F4F7FA; --ink-2:#B7C2CC;
  --muted:#8B97A3; --muted-2:#77838F; --faint:#3B4854;
  --accent:#8B90FF; --accent-2:#6E73EC; --accent-soft:#2C3157; --accent-wash:#1A2032;
  --c1:#6E73EC; --c2:#0AA98F; --c3:#DE6A52; --c4:#A169DC; --c5:#B98C2A;
  --good:#0AA98F; --warn:#B98C2A; --crit:#DE6A52; --neg:#E86BA0;
  --good-wash:#0F2C28; --warn-wash:#2C2416; --crit-wash:#301C18; --neutral-wash:#1C242C;
  --shadow:0 2px 10px rgba(0,0,0,.55);
  --grid:#222C35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans","Hellix",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700;color:var(--ink-strong);letter-spacing:-.02em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- top nav ---------- */
.topnav{background:var(--card);border-bottom:1px solid var(--line);height:72px;
  display:flex;align-items:center;gap:24px;padding:0 22px;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0;color:var(--ink-strong)}
.logo svg{display:block;width:106px;height:auto}

.navlinks{display:flex;align-items:center;gap:19px;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlink{background:none;border:0;padding:4px 0;cursor:pointer;white-space:nowrap;
  font-size:12.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-2)}
.navlink:hover{color:var(--ink)}
.navlink[aria-current="true"]{color:var(--ink-strong);position:relative}
.navlink[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-26px;height:3px;background:var(--accent)}
.navright{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:7px 13px;cursor:pointer;color:var(--muted);
  font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.viewas{display:flex;align-items:center;gap:8px}
.viewas span{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
.viewas select{min-width:170px;padding:7px 10px;font-size:13px}
@media(max-width:1080px){.viewas span{display:none}}
.iconbtn{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;font-size:15px}
.iconbtn:hover{background:var(--neutral-wash);color:var(--ink)}

/* ---------- context band ---------- */
.context{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.context h1{font-size:26px}
.ctxlabel{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.divider{width:1px;height:26px;background:var(--line)}
.stepper{display:flex;align-items:center;gap:14px}
.step{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);background:none;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:12px;line-height:1}
.step:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.step:disabled{opacity:.35;cursor:default}
.period{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-strong)}
select.pick{background:var(--card);border:1px solid var(--line-2);border-radius:4px;
  padding:9px 12px;font-size:14px;min-width:150px;color:var(--ink)}
.ctxright{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.back{background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:19px;padding:0 6px;line-height:1}

/* ---------- layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:26px}
.row{display:grid;gap:20px;margin-bottom:20px;align-items:start}
.row.two{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.row.two.split{grid-template-columns:minmax(290px,1fr) minmax(340px,1.35fr)}
.row.three{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.row.four{grid-template-columns:repeat(auto-fit,minmax(198px,1fr))}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.card.pad{padding:24px}
.chead{padding:20px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.chead h2{font-size:20px}
.chead .spacer{flex:1}
.cbody{padding:0 24px 24px}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);
  padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow);font-size:13.5px;max-width:none}
.note b{color:var(--ink-strong)}
.note .tag{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--warn);
  display:block;margin-bottom:5px}
.note.good{border-left-color:var(--good)} .note.good .tag{color:var(--good)}
.note.crit{border-left-color:var(--crit)} .note.crit .tag{color:var(--crit)}
.hint{color:var(--muted);font-size:13.5px;max-width:76ch;margin:0 0 20px}

/* ---------- metrics ---------- */
.metric{display:flex;flex-direction:column;gap:6px}
.mlabel{font-size:12px;font-weight:600;color:var(--muted)}
.mval{font-size:36px;font-weight:600;letter-spacing:-1.25px;color:var(--num);line-height:1.05}
.mval.sm{font-size:30px;letter-spacing:-1px}
.mval.xs{font-size:24px;letter-spacing:-.6px}
.mval.link{color:var(--accent)}
.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:26px}
.delta{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;margin-left:8px}
.delta.up{color:var(--good)} .delta.down{color:var(--neg)}
.hero{text-align:center;padding:44px 24px}
.hero .mval{font-size:44px;letter-spacing:-1.6px}
.hero .mlabel{margin-top:10px;font-size:13px}
.adderbox{margin:22px auto 0;max-width:270px;padding:14px 16px;border:1px solid var(--line);
  border-radius:8px;background:var(--neutral-wash);display:flex;flex-direction:column;gap:2px}
.adderbox[role=button]{cursor:pointer}
.adderbox[role=button]:hover{border-color:var(--accent)}
.adderbox .mlabel{margin-top:0;font-size:11px}
.adderbox b{font-size:26px;letter-spacing:-.8px;color:var(--c2);line-height:1.15}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:99;
  max-width:min(560px,92vw);padding:12px 18px;border-radius:8px;font-size:14px;line-height:1.45;
  background:var(--ink-strong);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--crit)}

/* ---------- date lines ---------- */
.when{display:flex;align-items:baseline;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.when:last-of-type{border-bottom:0}
.when span{flex:0 0 66px;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.when b{color:var(--ink-strong);font-weight:600}
.when.pay b{color:var(--accent-2);font-weight:700}

/* ---------- tables ---------- */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:13px;font-weight:700;color:var(--ink-2);padding:12px 14px;
  border-bottom:1px solid var(--line);border-top:1px solid var(--line);white-space:nowrap;
  background:var(--card);position:sticky;top:0;z-index:1}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--card-2)}
tr.clickable{cursor:pointer}
td.r,th.r{text-align:right}
td.n{white-space:nowrap}
td.idx{color:var(--faint);font-size:12px;width:40px}
tfoot td{padding:13px 14px;font-weight:700;color:var(--ink-strong);background:var(--card-2);
  border-top:1px solid var(--line-2);border-bottom:0}
.muted{color:var(--muted-2)}
.sub{font-size:12px;color:var(--muted-2);margin-top:2px}
.dash{color:var(--faint)}

.who{display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-size:10px;font-weight:800;color:#fff;letter-spacing:.3px}
.avatar.lg{width:34px;height:34px;font-size:12px}

.pill{display:inline-block;padding:3px 10px;border-radius:3px;font-size:11.5px;font-weight:700;
  letter-spacing:.4px;white-space:nowrap}
.pill.good{background:var(--good-wash);color:var(--good)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.crit{background:var(--crit-wash);color:var(--crit)}
.pill.info{background:var(--accent-wash);color:var(--accent-2)}
.pill.plain{background:var(--neutral-wash);color:var(--muted)}

.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:9px 18px;
  font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.2px}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--neutral-wash)}
.btn.soft{background:var(--accent-soft);color:var(--accent-2)}
.btn:focus-visible,.navlink:focus-visible,.seg button:focus-visible,.step:focus-visible,
tr.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{background:var(--card);border:1px solid var(--line-2);border-radius:4px;padding:9px 13px;
  font-size:14px;min-width:230px}
.search::placeholder{color:var(--muted-2)}

.bar{height:6px;background:var(--neutral-wash);border-radius:3px;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c1)}

/* ---------- plan cards ---------- */
.plan{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column}
.plan .ptitle{padding:20px 18px;text-align:center;font-size:14px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-strong);border-bottom:1px solid var(--line)}
.plan .pmid{padding:30px 18px;text-align:center;flex:1;display:flex;flex-direction:column;
  align-items:center;gap:8px;justify-content:center}
.plan .pmid .glyph{width:42px;height:42px;border-radius:50%;border:2px solid var(--faint);
  display:grid;place-items:center;color:var(--faint);font-size:18px;font-weight:700;margin-bottom:6px}
.plan .pfoot{border-top:1px solid var(--line);padding:15px;text-align:center}
.plan .pfoot button{background:none;border:0;cursor:pointer;color:var(--accent);
  font-size:12.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:inherit;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.tip{position:fixed;pointer-events:none;z-index:90;background:var(--ink-strong);color:var(--bg);
  padding:7px 11px;border-radius:4px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .12s;
  white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.tip.on{opacity:1}
@media (prefers-reduced-motion:reduce){.tip{transition:none}}

/* ---------- rates editor ---------- */
.rate{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:0}
.rate .rl{flex:1;min-width:0}
.rate .rl b{font-weight:700;font-size:14px;color:var(--ink-strong)}
.rate input{width:82px;text-align:right;background:var(--card);border:1px solid var(--line-2);
  border-radius:4px;padding:8px 10px;font-weight:600}
.rate .unit{color:var(--muted);width:12px}
.grouplabel{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--muted);padding:18px 0 4px}

/* ---------- tab strip ---------- */
.tabs{display:flex;gap:2px;flex-wrap:wrap;min-width:0}
.tabbtn{background:none;border:1px solid transparent;border-radius:4px;padding:7px 12px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tabbtn:hover{background:var(--neutral-wash);color:var(--ink)}
.tabbtn[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-2);border-color:var(--accent)}
.tabbtn[aria-pressed="true"] .pill{background:var(--accent);color:#fff}
.panelbody{border-top:1px solid var(--line);padding:18px 20px 20px}
.panelbody>.card{box-shadow:none;border:0;padding:0}
.panelbody>.card>.chead{padding:0 0 14px}
.panelbody>.card>.cbody{padding:0}
.panelbody>.card>.scroll{margin:0}

/* ---------- adjustment form ---------- */
.adjform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;
  padding:18px;border:1px solid var(--line-2);background:var(--card-2)}
.adjform label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.adjform input,.adjform select{background:var(--card);border:1px solid var(--line-2);border-radius:4px;
  padding:9px 11px;font-size:14px;color:var(--ink);width:100%}
.adjform input:disabled{color:var(--muted-2);background:var(--neutral-wash)}
.adjform .actions{display:flex;gap:10px;flex-wrap:wrap}
.err{color:var(--crit);font-size:13px;font-weight:600;padding:12px 0 0}

/* ---------- tree ---------- */
.tnode{border-left:1px solid var(--line);margin-left:14px;padding-left:18px}
.trow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{font-weight:600}
.trow .amt{margin-left:auto;font-weight:700;color:var(--num)}
.lvl{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);
  border:1px solid var(--line-2);border-radius:3px;padding:2px 7px;white-space:nowrap}


/* ================= mobile ================= */
@media(max-width:900px){
  .wrap{padding:16px 14px 56px}
  .row{gap:14px;margin-bottom:14px}
  .row.two,.row.three,.row.four{grid-template-columns:1fr}
  .card.pad{padding:18px}
  .chead{padding:16px 18px;gap:10px}
  .cbody{padding:0 18px 18px}
  .chead h2{font-size:17px}
  .mval{font-size:30px;letter-spacing:-1px}
  .mval.sm{font-size:25px} .mval.xs{font-size:21px}
  .hero{padding:28px 18px}
  .hero .mval{font-size:35px}
  .note{padding:14px 16px}
  .panelbody{padding:14px 16px 16px}
}
@media(max-width:760px){
  /* --- nav: logo row, then a scrolling link row --- */
  .topnav{height:auto;min-height:56px;padding:10px 14px 0;gap:0 8px;flex-wrap:wrap;align-items:center}
  .navright{display:contents}
  .logo{order:1;margin-right:auto}
  .logo svg{width:88px}
  .iconbtn{order:2}
  .avatar.lg{order:3}
  .viewas{order:4;flex:0 0 100%;padding:8px 0 2px}
  .viewas select{width:100%;min-width:0}
  .navlinks{order:5;width:100%;gap:0;border-top:1px solid var(--line);
    margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .navlink{padding:12px 14px;font-size:12px;letter-spacing:.8px}
  .navlink:first-child{padding-left:0}
  .navlink[aria-current="true"]::after{bottom:0}

  .context{padding:12px 14px;gap:10px}
  .context h1{font-size:20px;width:100%}
  .ctxlabel{font-size:11px;letter-spacing:.9px}
  .divider{display:none}
  .stepper{gap:10px;width:100%}
  .stepper .period{flex:1;text-align:center;font-size:12px}
  .step{width:38px;height:38px;font-size:15px}
  .ctxright{margin-left:0;width:100%}
  .ctxright select.pick{width:100%}
  .back{font-size:22px;padding:0 4px}

  /* --- tap targets --- */
  .btn{padding:11px 16px;min-height:42px}
  .iconbtn{width:38px;height:38px}
  .search{width:100%;min-width:0;padding:11px 13px}
  select.pick{padding:11px 12px}

  /* --- tab strips scroll rather than wrap --- */
  .tabs{flex-wrap:wrap;gap:4px;max-width:100%;width:100%}
  .tabbtn{padding:9px 11px;font-size:12.5px}
  .chead .spacer{display:none}

  /* --- every labelled table becomes stacked rows --- */
  .scroll{overflow-x:visible;min-width:0}
  table.stacked{display:block;width:100%;border-collapse:collapse}
  table.stacked thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table.stacked tbody{display:block;width:100%}
  table.stacked tbody tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  table.stacked tbody tr:last-child{border-bottom:0}
  table.stacked tbody tr:hover{background:none}
  table.stacked tbody td{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    border:0;padding:5px 16px;text-align:right;min-width:0}
  table.stacked tbody td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;
    text-align:left;flex:0 0 auto;max-width:48%}
  table.stacked tbody td[data-label=""]::before{content:none}
  table.stacked tbody td.idx{display:none}
  table.stacked tbody td[colspan]{justify-content:flex-start;padding:14px 16px}
  table.stacked tbody td[colspan]::before{content:none}
  table.stacked tbody td.lead{display:block;text-align:left;font-weight:700;color:var(--ink-strong);
    font-size:15px;padding:2px 16px 8px}
  table.stacked tbody td.lead::before{content:none}
  table.stacked tbody td .sub{text-align:right}
  table.stacked tbody td.lead .sub{text-align:left}
  table.stacked tbody td .who{justify-content:flex-end}
  table.stacked tbody td.lead .who{justify-content:flex-start}
  table.stacked tfoot{display:block;width:100%;border-top:1px solid var(--line-2)}

function recruitRun(month, strict) {

    : d.close && +d.close.slice(5, 7) === +month.slice(5, 7)));

    if (d.selfGen) bump(self, d.closer, v); else { bump(cl, d.closer, v); bump(st, d.canvasser, v); } });

    if (!s && !c && !t) return;

    const a2 = s * S.recruit.l2.self + c * S.recruit.l2.closer + t * S.recruit.l2.setter;

/* ---- bonuses land in the second Friday run of the following month.
   Grounded in the workbook: July 2026 recruiting bonus and override both paid 8/14/2026. ---- */
function bonusPayday(y, m) {          /* first Friday after the 10th of month m */
  const d = new Date(Date.UTC(y, m - 1, 11));
  while (d.getUTCDay() !== 5) d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0, 10);
}
const BONUS_RUN = new Map();          /* payday -> the month it pays for */
const BONUS_OF = new Map();           /* month -> its payday */
MONTHS.forEach(m => {

  const pay = bonusPayday(mm === 12 ? y + 1 : y, mm === 12 ? 1 : mm + 1);
  BONUS_RUN.set(pay, m); BONUS_OF.set(m, pay);
});
[...BONUS_RUN.keys()].forEach(d => {

/* ---- change orders: the contract value moved after commission was paid on it ---- */
const CO = new Map();                 /* deal id -> {delta, state, commRun, bonusRun, note} */
const firstOpenRun = () => RUNDATES2.slice().reverse().find(d => !isApproved(d)) || OPEN_RUN;
const nextBonusRun = () => [...BONUS_RUN.keys()].sort().find(d => !isApproved(d)) || firstOpenRun();
/* the value every plan should calculate on: what was paid, unless a change order has been applied */
function comBase(d) {
  const co = CO.get(d.id);
  return co && co.state === 'applied' ? d.value : d.baseImplied;
}
function applyCO(id, state) {
  const co = CO.get(id); if (!co) return;
  const d = DEALS[id];
  co.state = state;
  if (state === 'applied') {
    /* if the run that paid it is already closed, the difference is trued up in the next open run */
    co.commRun = isApproved(d.run) ? firstOpenRun() : null;
    const bd = BONUS_OF.get(d.month);
    co.bonusRun = bd && isApproved(bd) ? nextBonusRun() : null;
    co.at = D.frozenAt; co.by = ADMIN_NOW;

}
DEALS.forEach(d => {
  if (!d.won || !d.baseImplied) return;
  const delta = +(d.value - d.baseImplied).toFixed(2);
  if (Math.abs(delta) < 15) return;
  CO.set(d.id, { delta, state: 'pending', at: D.frozenAt, commRun: null, bonusRun: null,
    note: delta > 0 ? 'Contract value increased after commission was paid'
                    : 'Contract value reduced after commission was paid' });
});
const coPending = () => [...CO.entries()].filter(x => x[1].state === 'pending')
  .map(x => ({ d: DEALS[x[0]], co: x[1] })).sort((a, b) => Math.abs(b.co.delta) - Math.abs(a.co.delta));
const coApplied = () => [...CO.entries()].filter(x => x[1].state === 'applied')
  .map(x => ({ d: DEALS[x[0]], co: x[1] }));
/* what one change order is worth, leg by leg */
function coEffect(d) {
  const co = CO.get(d.id); if (!co) return null;
  const D_ = co.delta;
  const sRate = d.hourly ? S.rates.hourly : S.rates.canvasser;
  const out = { setter: 0, closer: 0, recruit: [], override: [], delta: D_ };
  if (d.canvPay || d.canvasser) out.setter = D_ * sRate;
  if (d.closer) out.closer = D_ * S.rates.closer;
  const legs = d.selfGen ? [[d.closer, 'self']] : [[d.closer, 'closer'], [d.canvasser, 'setter']];
  legs.forEach(l => {
    const e = byName.get(l[0]); if (!e) return;
    if (e.ref1) out.recruit.push({ to: e.ref1, on: l[0], lvl: 'L1', amt: D_ * S.recruit.l1[l[1]] });
    if (e.ref2) out.recruit.push({ to: e.ref2, on: l[0], lvl: 'L2', amt: D_ * S.recruit.l2[l[1]] });
  });
  const sp = D.mavryckPlan;
  legs.forEach(l => { if (sp.members.indexOf(l[0]) >= 0)
    out.recruit.push({ to: sp.owner, on: l[0], lvl: '2%', amt: D_ * sp.rate }); });
  SEATS.forEach(seat => {
    if (seat.region !== d.team) return;
    const person = seatPerson(seat.tier, seat.region, d.month);
    if (person) out.override.push({ to: person, region: seat.region, tier: tierOf(seat.tier).name,
      amt: D_ * tierOf(seat.tier).rate });
  });
  out.total = out.setter + out.closer + out.recruit.reduce((s2, r) => s2 + r.amt, 0)
    + out.override.reduce((s2, r) => s2 + r.amt, 0);
  return out;
}

/* ---- summer weekly bonus: setters who close 2+ deals in a Mon-Sun week ---- */
const SUMMER = { on: true, start: '2026-07-01', end: '', tier2: .02, tier3: .04 };
function weekStart(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());               /* back to Sunday */
  return d.toISOString().slice(0, 10);
}
const weekEnd = wk => { const d = new Date(wk + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 6);
  return d.toISOString().slice(0, 10); };
const weekLabel = wk => dtiny(wk) + ' - ' + dtiny(weekEnd(wk));
function summerDeals() {
  return DEALS.filter(d => d.won && d.close && SUMMER.on && d.close >= SUMMER.start
    && (!SUMMER.end || d.close <= SUMMER.end) && d.canvasser);
}
/* every setter's weeks; a week belongs to the month its Sunday falls in */
function summerWeeks(filterMonth) {
  const m = new Map();
  summerDeals().forEach(d => {
    const wk = weekStart(d.close);
    if (filterMonth && wk.slice(0, 7) !== filterMonth) return;
    if (!m.has(d.canvasser)) m.set(d.canvasser, new Map());
    const w = m.get(d.canvasser);
    if (!w.has(wk)) w.set(wk, { week: wk, deals: [], value: 0, base: 0 });
    const e = w.get(wk); e.deals.push(d); e.value += comBase(d); e.base += d.canvPay;
  });
  const out = [];
  m.forEach((weeks, name) => {
    const list = [...weeks.values()].map(w => {
      w.count = w.deals.length;
      w.rate = w.count >= 3 ? SUMMER.tier3 : w.count === 2 ? SUMMER.tier2 : 0;
      w.amount = +(w.value * w.rate).toFixed(2);
      w.qualifying = w.count >= 2;
      w.baseRate = w.value ? w.base / w.value : 0;
      w.effective = w.baseRate + w.rate;
      return w;
    }).sort((a, b) => b.week.localeCompare(a.week));
    out.push({ name, weeks: list,
      base: list.filter(w => w.qualifying).reduce((a, w) => a + w.base, 0),
      qualifying: list.filter(w => w.qualifying).length,
      deals: list.reduce((a, w) => a + w.count, 0),
      total: list.reduce((a, w) => a + w.amount, 0) });
  });
  return out.filter(r => r.total > 0 || !filterMonth)
    .sort((a, b) => b.qualifying - a.qualifying || b.deals - a.deals || b.total - a.total);
}
/* a month's summer bonus is payable in the following month's bonus run, always */
function summerPayRun(month) { return BONUS_OF.get(month) || null; }
function summerMonthsFor(date) {
  return MONTHS.filter(m => m >= SUMMER.start.slice(0, 7) && summerPayRun(m) === date);
}

/* one sheet per run: commission + bonuses + adjustments, per person */
/* ---- commission holds: an admin can withhold either leg of a deal ---- */
const HOLD_REASONS = ['Customer financing not approved', 'Awaiting signed change order',
  'Job cancelled - chargeback pending', 'Rep eligibility under review',
  'Contract value in dispute', 'Install on hold', 'Other'];
const HOLDS = new Map();   /* deal id -> {setter, closer, reason, at} where a leg is 'held' or 'released' */
function legState(d, leg) { const h = HOLDS.get(d.id); return (h && h[leg]) || 'pay'; }
function legAmt(d, leg) { return leg === 'setter' ? d.canvPay : d.closerPay; }
function legWho(d, leg) { return leg === 'setter' ? d.canvasser : d.closer; }
/* a released leg pays in the next open run when its own run has already gone out */
function legRun(d, leg) { return legState(d, leg) === 'released' && d.run <= LAST_PAID ? OPEN_RUN : d.run; }
function setHold(id, leg, state, reason, by, at) {
  const h = HOLDS.get(id) || { setter: null, closer: null, reason: '', at: at || D.frozenAt, by: by || ADMIN_NOW };
  h[leg] = state;
  h.by = by || ADMIN_NOW;

  if (reason) h.reason = reason;

/* a snapshot of one deal's hold, so a refused save can be put back */
function holdSnapshot(id) {

  return h ? Object.assign({}, h) : null;
}
function holdRestore(id, snap) { if (snap) HOLDS.set(id, snap); else HOLDS.delete(id); }
function allHolds() {
  const out = [];
  HOLDS.forEach((h, id) => ['setter', 'closer'].forEach(leg => {
    if (h[leg] === 'held') out.push({ d: DEALS[id], leg, amt: legAmt(DEALS[id], leg), reason: h.reason, at: h.at });
  }));

/* Holds are records in the dataset, matched to a deal by opportunity and closing

/* ===========================================================================
   Saving what an admin does
   ---------------------------------------------------------------------------
   Holds, releases, adjustments, change orders and freezing a run are not edits
   to state in this tab: each is an event posted to the server and stored. The
   screen applies the change straight away so it feels immediate, then confirms.
   If the server refuses - not an admin, run already frozen, deal not in the
   ledger - the change is rolled back and the reason is shown. The server is the
   authority; this page is a view of it.
   =========================================================================== */
const dealKey = d => d.opp + '|' + d.close;

function toast(msg, bad) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, bad ? 6000 : 2600);

/* post one event. `undo` puts the screen back if the server says no. */
function save(kind, target, payload, undo) {
  if (!LIVE) return Promise.resolve(null);      /* standalone prototype: nothing to save to */
  SAVING++;
  return fetch('/commissions/events', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: kind, target: target, payload: payload || {} })
  })
    .then(r => r.json().catch(() => ({})).then(b => {
      if (!r.ok) throw new Error(b.error || ('Refused (' + r.status + ')'));
      return b.event;
    }))
    .catch(e => {
      if (undo) undo();
      toast(e.message === 'Failed to fetch'
        ? 'No connection - that change was not saved.' : e.message, true);
      render();
      return null;
    })
    .then(v => { SAVING--; return v; });
}

/* replay the stored events over the seeded state, oldest first */
function applyEvents(events) {
  (events || []).forEach(e => {
    const p = e.payload || {};
    if (e.kind === 'run.freeze') { FROZEN.add(e.target); return; }
    if (e.kind === 'adjustment') {
      ADJ.push({ id: 'e' + e.id, who: e.target, kind: p.type, label: p.note || p.type,
        note: 'Added ' + dshort(String(e.at).slice(0, 10)) + ' by ' + e.actor,
        amount: adjSign(p.type) * Math.abs(+p.amount || 0), run: p.run });
      return;
    }
    if (e.kind === 'adjustment.remove') {
      const i = ADJ.findIndex(a => a.id === 'e' + e.target);
      if (i >= 0) ADJ.splice(i, 1);
      return;
    }
    const d = DEAL_BY_KEY.get(e.target);
    if (!d) return;                              /* outside this person's scope */
    if (e.kind === 'hold') setHold(d.id, p.leg, 'held', p.reason, e.actor, String(e.at).slice(0, 10));
    if (e.kind === 'release') setHold(d.id, p.leg, 'released', '', e.actor, String(e.at).slice(0, 10));
    if (e.kind === 'changeorder.apply') applyCO(d.id, 'applied');
    if (e.kind === 'changeorder.undo') applyCO(d.id, 'pending');
  });
}

function runSheet(date) {
  const run = RUNS.find(r => r.date === date) || { date, deals: [] };
  const bm = BONUS_RUN.get(date);
  const m = new Map();
  const touch = n => {
    if (!m.has(n)) m.set(n, { name: n, setter: 0, closer: 0, recruit: 0, override: 0, adj: 0,
      released: 0, heldBack: 0, co: 0, summer: 0, deals: [], bonusLines: [], holds: [],
      coLines: [], summerLines: [] });
    return m.get(n);
  };
  const consider = run.deals.slice();
  HOLDS.forEach((h, id) => { const d = DEALS[id]; if (d && consider.indexOf(d) < 0) consider.push(d); });
  const held = [];
  consider.forEach(d => ['setter', 'closer'].forEach(leg => {
    const amt = legAmt(d, leg);
    if (!amt) return;
    const st = legState(d, leg);
    if (st === 'held') {
      if (d.run === date) {
        const r = touch(legWho(d, leg));
        r.heldBack += amt; r.holds.push({ d, leg, amt });
        held.push({ d, leg, amt, who: legWho(d, leg), reason: (HOLDS.get(d.id) || {}).reason });
      }
      return;
    }
    if (legRun(d, leg) !== date) return;
    const r = touch(legWho(d, leg));
    if (leg === 'setter') r.setter += amt; else r.closer += amt;
    if (st === 'released') r.released += amt;
    if (r.deals.indexOf(d) < 0) r.deals.push(d);
  }));
  if (bm) {
    (PRE_RECRUIT ? preRecruit(bm) : recruitRun(bm, S.strictYear)).forEach(x => {
      const r = touch(x.name); r.recruit += x.total;
      x.lines.forEach(l => r.bonusLines.push(l));
    });
    overrideByPerson(bm).forEach(x => { touch(x.name).override += x.amount; });
  }
  /* summer weekly bonus for every month that pays in this run */
  summerMonthsFor(date).forEach(m => {
    summerWeeks(m).forEach(x => {
      if (!x.total) return;
      const r = touch(x.name); r.summer += x.total;
      x.weeks.filter(w => w.qualifying).forEach(w =>
        r.summerLines.push({ month: m, week: w.week, count: w.count, value: w.value, rate: w.rate,
          amt: w.amount, base: w.base, baseRate: w.baseRate, effective: w.effective,
          dealIds: w.deals.map(d => d.id) }));
    });
  });
  /* change orders on runs that already went out are trued up here */
  coApplied().forEach(x => {
    const eff = coEffect(x.d); if (!eff) return;
    if (x.co.commRun === date) {
      if (eff.setter) { const r = touch(x.d.canvasser); r.co += eff.setter;
        r.coLines.push({ d: x.d, what: 'Setter commission', amt: eff.setter }); }
      if (eff.closer) { const r = touch(x.d.closer); r.co += eff.closer;
        r.coLines.push({ d: x.d, what: 'Closer commission', amt: eff.closer }); }
    }
    if (x.co.bonusRun === date) {
      eff.recruit.forEach(l => { const r = touch(l.to); r.co += l.amt;
        r.coLines.push({ d: x.d, what: 'Recruiting ' + l.lvl + ' on ' + l.on, amt: l.amt }); });
      eff.override.forEach(l => { const r = touch(l.to); r.co += l.amt;
        r.coLines.push({ d: x.d, what: 'Override ' + l.region, amt: l.amt }); });
    }
  });
  ADJ.filter(a => a.run === date).forEach(a => { touch(a.who).adj += a.amount; });
  const rows = [...m.values()].map(r => {
    r.commission = r.setter + r.closer;
    r.bonus = r.recruit + r.override + r.summer;
    r.total = r.commission + r.bonus + r.adj + r.co;
    return r;
  }).filter(r => Math.abs(r.total) > 0.004 || r.heldBack > 0.004).sort((a, b) => b.total - a.total);
  return { date, bonusMonth: bm, deals: run.deals, rows,
    state: runStatus(date), held,
    withheld: held.reduce((s, h) => s + h.amt, 0),
    total: rows.reduce((s, r) => s + r.total, 0) };
}
const sheetCache = new Map();

      + (DEALS.filter(d => d.won && d.run <= LAST_PAID).length - 19) + ' previously paid deals carry no record of when '
      + 'they were paid. The runs here are rebuilt from close dates using a rule that reproduces both known runs exactly.',

      + 'so a duplicate pays the wrong person or pays twice.',

function roundTop(x, y, w, h, r) {
  if (h <= 0) return '';

  return `M${x},${y + h}L${x},${y + r}Q${x},${y} ${x + r},${y}L${x + w - r},${y}Q${x + w},${y} ${x + w},${y + r}L${x + w},${y + h}Z`;
}
function barChart(data, opts) {
  opts = opts || {};
  const W = 360, H = 128, PB = 20, PT = 16, PR = 78;
  const max = Math.max(1, ...data.map(d => d.v));
  const avg = data.reduce((s, d) => s + d.v, 0) / (data.length || 1);
  const plotW = W - PR - 8, band = plotW / Math.max(data.length, 1), bw = Math.min(13, band * .56);
  const y = v => PT + (H - PT - PB) * (1 - v / max);
  let hi = opts.highlight != null ? data.findIndex(d => d.k === opts.highlight) : -1;
  if (hi < 0) hi = data.length - 1;
  const bars = data.map((d, i) => {
    const x = 4 + band * i + (band - bw) / 2, yy = y(d.v), h = (H - PB) - yy;
    return `<path d="${roundTop(x, yy, bw, d.v > 0 ? Math.max(h, 3) : 0, 4)}" fill="${i === hi ? 'var(--c2)' : 'var(--faint)'}"></path>
      <rect x="${4 + band * i}" y="${PT}" width="${band}" height="${H - PB - PT}" fill="transparent"
        data-tip="${dshort(d.k)}: ${fmt(d.v)}"></rect>`;
  }).join('');
  const ay = y(avg);
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 16}" role="img"
      aria-label="Payable by run. Selected ${fmt(data[hi] ? data[hi].v : 0)}, average ${fmt(avg)}.">
    <line x1="4" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="4" y1="${ay}" x2="${W - PR}" y2="${ay}" stroke="var(--line-2)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="${W - PR + 10}" y="${ay - 3}" font-size="13" font-weight="700" fill="var(--num)">${fmtK(avg)}</text>
    <text x="${W - PR + 10}" y="${ay + 12}" font-size="10.5" fill="var(--muted)">Average</text>
    ${bars}
    ${data.map((d, i) => `<text x="${4 + band * i + band / 2}" y="${H - 4}" font-size="10.5"
      fill="${i === hi ? 'var(--ink-2)' : 'var(--muted-2)'}" font-weight="${i === hi ? '700' : '400'}"
      text-anchor="middle">${+d.k.slice(8)}</text>`).join('')}
  </svg>`;
}
function donut(parts, total) {
  const live = parts.filter(p => Math.abs(p.value) > 0.005)
    .map(p => ({ label: p.label, value: Math.abs(p.value), color: p.color }));
  const sum = live.reduce((s, p) => s + p.value, 0) || 1;
  const R = 54, C = 2 * Math.PI * R, GAP = live.length > 1 ? 3 : 0;
  let off = 0;
  const arcs = live.map(p => {
    const len = Math.max(C * (p.value / sum) - GAP, 1);
    const el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}" stroke-width="17"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"
      data-tip="${p.label}: ${fmt(p.value)} (${(p.value / sum * 100).toFixed(0)}%)"></circle>`;
    off += C * (p.value / sum); return el;
  }).join('');
  return `<svg class="chart" viewBox="0 0 140 140" style="max-width:170px;margin:0 auto" role="img"
      aria-label="Split. ${live.map(p => p.label.replace(/&[a-z]+;/g, ' ') + ' ' + fmt0(p.value)).join(', ')}.">
    <g transform="rotate(-90 70 70)">${live.length ? arcs
      : `<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--neutral-wash)" stroke-width="17"></circle>`}</g>
    <text x="70" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="var(--num)" letter-spacing="-.5">${fmtK(total)}</text>
    <text x="70" y="84" text-anchor="middle" font-size="10.5" fill="var(--muted)">total</text>
  </svg>`;
}

function deltaTag(cur, prev) {
  if (!prev) return '';

}

/* ---- one strip for everything that needs a decision before the freeze ---- */

  const holds = allHolds().filter(h => scopeName(legWho(h.d, h.leg)));
  const adjs = ADJ.filter(a => a.run === sh.date);

  const tabs = [
    { k: 'co', label: 'Change orders', n: cos.length, tone: cos.length ? 'warn' : 'good' },
    { k: 'holds', label: 'On hold', n: holds.length, tone: holds.length ? 'crit' : 'good' },
    { k: 'adj', label: 'Adjustments', n: adjs.length, tone: 'plain' },
    summerMonths.length ? { k: 'summer', label: 'Summer bonus', n: null, tone: 'info' } : null,
    { k: 'checks', label: 'Data checks', n: crit, tone: crit ? 'crit' : 'good' }
  ].filter(Boolean);
  const open = S.panel;

/* ---- deals ---- */
V.deals = () => {

  if (S.dealFilter === 'flagged') list = list.filter(d => d.flagged || d.unknownRep);
  if (S.dealFilter === 'selfgen') list = list.filter(d => d.selfGen && d.won);
  if (S.dealFilter === 'hold') list = list.filter(d => HOLDS.has(d.id));
  if (S.dealFilter === 'co') list = list.filter(d => CO.has(d.id));

/* ---- Vivid Adder balances ---- */
function adderCard() {
  const q = QUARTERS.includes(S.adderQ) ? S.adderQ : THIS_Q;
  const rows = adderLeaders(q);
  const count = rows.reduce((a, x) => a + x.count, 0);
  const total = count * S.adderRate;
  const deals = DEALS.filter(d => d.won && (+d.adder || 0) !== 0 && quarterOf(d.close) === q).length;
  const qTot = QUARTERS.map(k => {
    const n = DEALS.filter(d => d.won && quarterOf(d.close) === k)
      .reduce((a, d) => a + (+d.adder || 0), 0);
    return { q: k, count: n, amount: n * S.adderRate };
  });
  const grand = qTot.reduce((a, x) => a + x.amount, 0);
  return `<div class="card" style="margin-top:20px">
    <div class="chead"><h2>Vivid Adder</h2>
      <span class="pill info">${count} adders</span>
      <span class="pill good">${fmt0(total)} in ${qLabel(q)}</span>
      <span class="pill ${adderPaid(q) ? 'good' : 'info'}">${adderPaid(q) ? 'Paid' : 'Pays'} ${dshort(adderPayday(q))}</span>
      <div class="spacer"></div>
      <span class="mlabel">A count from Odoo &middot; not commission</span></div>
    <div class="cbody">
    <p class="hint" style="margin:0 0 18px">Odoo carries a <b>VIVID Adder</b> count on some won deals &mdash;
    a number of adders, not a dollar figure. Each one is worth a fixed amount and accrues to whoever closed the
    deal. Balances are kept <b>per calendar quarter</b> of the closing date, so each quarter starts from zero,
    and a quarter pays out <b>two quarters later</b> &mdash; on the first Friday after the 10th of that
    quarter's first month. Q1 pays in July, Q2 in October, Q3 the following January, Q4 the following April.
    It is not commission: no percentage applies to it, it is not tied to the weekly commission run, and it is
    not in any payable total.</p>

function leadershipCard() {
  const month = effectiveMonth();
  const admin = S.role === 'admin';
  const staff = EMP.filter(e => e.active).map(e => e.name).sort();
  const rowsFor = overrideRows(month);
  const cost = k => rowsFor.filter(r => r.tierKey === k).reduce((a, r) => a + r.amount, 0);
  const picker = (tier, region) => {
    const seat = seatOf(tier, region);
    const now = seatPerson(tier, region, month);
    const past = seat && seat.history.filter(h => h.person && h.person !== now);
    const trail = past && past.length
      ? `<div class="sub">was ${past.map(h => esc(h.person)).join(', ')}</div>` : '';
    if (!admin) return (now ? who2(now) : '<span class="dash">--</span>') + trail;
    return `<select class="pick" data-seat="${tier}:${esc(region)}" aria-label="${tier} for ${esc(region)}"
        style="min-width:148px">
      <option value="">Unassigned</option>
      ${staff.map(n => `<option ${now === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}
    </select>${trail}`;
  };
  return `<div class="card" style="margin-top:20px">
    <div class="chead"><h2>Leadership and override plans</h2>
      <div class="spacer"></div><span class="mlabel">Cost shown for ${monLabel(month)}</span></div>
    <div class="cbody">
      <p class="hint" style="margin:0 0 18px">Each tier earns its own percentage of its region&rsquo;s won revenue,
      for the month a deal closed. One person can hold more than one seat and earns on each &mdash; the Team Manager
      and the Director can be the same person or two different people, per region. Leave a seat unassigned and nothing
      is paid for it. <b>A change takes effect from ${monLabel(month)}</b>, the earliest month whose bonus run has not
      frozen; months already paid keep whoever held the seat then.</p>
      <div class="row three" style="margin-bottom:22px">
        ${TIERS.map(t => `<div class="card pad" style="box-shadow:none">
          <div class="metric"><span class="mlabel">${t.name}</span>
            <div style="display:flex;align-items:baseline;gap:10px">
              <input type="number" step="0.25" min="0" value="${(t.rate * 100).toFixed(2)}"
                data-tier="${t.key}" aria-label="${t.name} rate" ${admin ? '' : 'disabled'}
                style="width:86px;text-align:right;background:var(--card);border:1px solid var(--line-2);
                border-radius:4px;padding:8px 10px;font-weight:600">
              <span class="mlabel">% of won revenue</span></div>
            <span class="mlabel">${t.note}</span>
            <span class="mlabel">${REGIONS.filter(r => seatPerson(t.key, r, month)).length} of ${REGIONS.length} seats
              &middot; ${fmt0(cost(t.key))} in ${monLabel(month)}</span>
          </div></div>`).join('')}
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Region</th>${TIERS.map(t => `<th>${t.name} &middot; ${pct(t.rate)}</th>`).join('')}
          <th class="r">${monLabel(month)} revenue</th><th class="r">Override cost</th></tr></thead>
        <tbody>${REGIONS.map(region => {
          const rev = regionRevenue(month, region);
          const c = rowsFor.filter(r => r.region === region).reduce((a, r) => a + r.amount, 0);
          return `<tr><td class="name">${esc(region)}</td>
            ${TIERS.map(t => `<td>${picker(t.key, region)}</td>`).join('')}
            <td class="n r muted">${fmt0(rev)}</td>
            <td class="n r">${c ? `<b>${fmt(c)}</b>` : '<span class="dash">--</span>'}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td colspan="${TIERS.length + 1}">Total for ${monLabel(month)}</td>
          <td class="n r">${fmt0(REGIONS.reduce((a, r) => a + regionRevenue(month, r), 0))}</td>
          <td class="r">${fmt(rowsFor.reduce((a, r) => a + r.amount, 0))}</td></tr></tfoot>
      </table></div>
      <div class="grouplabel">Who earns what</div>
      <div class="scroll"><table><thead><tr><th>Person</th><th>Seats held</th>
        <th class="r">${monLabel(month)} override</th></tr></thead>
        <tbody>${overrideByPerson(month).map(p => `<tr class="clickable" data-focus="${esc(p.name)}" tabindex="0">
          <td>${who2(p.name)}</td>
          <td class="muted">${p.parts.map(x => esc(x.tier) + ' &middot; ' + esc(x.region) + ' at ' + pct(x.rate)).join('<br>')}</td>
          <td class="n r"><b>${fmt(p.amount)}</b></td></tr>`).join('')
        || '<tr><td colspan="3" class="muted">No seats assigned yet.</td></tr>'}</tbody>
      </table></div>
    </div></div>`;
}

/* ---- one deal ---- */
function dealPanel(id) {
  const d = DEALS[id];
  const rows = [
    ['Status', d.won ? '<span class="pill good">Won</span>' : '<span class="pill crit">Lost</span>'],
    ['Sales team', esc(d.team || '&mdash;')], ['Stage', esc(d.stage || '&mdash;')],
    ['Closed', dday(d.close)],
    ['Commission pays', dday(d.run) + ' <span class="pill ' + (d.state === 'paid' ? 'good' : d.state === 'open' ? 'warn' : 'plain') + '">'
      + (d.state === 'paid' ? 'Paid' : d.state === 'open' ? 'Open' : 'Scheduled') + '</span>'
      + '<div class="sub">that run covers ' + windowLabel(d.run) + ', and freezes ' + freezeLabel(d.run) + '</div>'],
    ['Bonuses pay', d.month && BONUS_OF.get(d.month)
      ? dday(BONUS_OF.get(d.month)) + '<div class="sub">' + monLabel(d.month)
        + ' recruiting, override and summer bonus</div>' : '&mdash;'],
    ['Contract value', fmt(d.value)],
    ['Units', d.units + ' windows / doors' + (d.adder ? ' &middot; ' + d.adder + ' adder' : '')],
    ['Setter', who2(d.canvasser) + (d.hourly ? ' <span class="pill plain">Hourly &middot; 1%</span>' : '')],
    ['Closer', who2(d.closer) + (d.selfGen ? ' <span class="pill info">Self-gen</span>' : '')]
  ];
  return `<div class="row two">
    <div class="card pad"><h2 style="margin-bottom:16px">Deal</h2>
      <table>${rows.map(r => `<tr><td class="muted" style="width:150px;border:0;padding:9px 0">${r[0]}</td>
        <td style="border:0;padding:9px 0">${r[1]}</td></tr>`).join('')}</table></div>
    <div class="card pad"><h2 style="margin-bottom:16px">Commission on this deal</h2>
      <table><tbody>
        <tr><td>Setter${d.hourly ? ' &middot; hourly' : ''}</td>
          <td class="n r muted">${pct(d.hourly ? S.rates.hourly : S.rates.canvasser)}</td>
          <td class="n r">${fmt(d.canvPay)}</td></tr>
        <tr><td>Closer</td><td class="n r muted">${pct(S.rates.closer)}</td><td class="n r">${fmt(d.closerPay)}</td></tr>
      </tbody><tfoot><tr><td colspan="2">Total</td><td class="r">${fmt(d.total)}</td></tr></tfoot></table>
      ${d.flagged ? `<div class="note" style="margin:22px 0 0"><span class="tag">Value changed after it was paid</span>
        Commission was worked out on a contract value of <b>${fmt(d.baseImplied)}</b>, but the deal now reads
        <b>${fmt(d.value)}</b> &mdash; a gap of ${fmt(d.variance)}. Nobody was paid on the difference.</div>` : ''}
      ${d.notes ? `<div class="grouplabel">Notes</div><p style="margin:0">${esc(d.notes)}</p>` : ''}
    </div></div>
  ${CO.has(d.id) ? coDealCard(d) : ''}
  ${d.won && (d.canvPay || d.closerPay) ? holdCard(d) : ''}`;
}

function coDealCard(d) {
  const co = CO.get(d.id), e = coEffect(d), admin = S.role === 'admin';
  const bon = e.total - e.setter - e.closer;
  const row = (what, who, amt) => `<tr><td>${what}</td><td class="muted">${esc(who)}</td>
    <td class="n r"><b style="color:${amt < 0 ? 'var(--crit)' : 'var(--good)'}">${fmt(amt)}</b></td></tr>`;
  return `<div class="card pad" style="margin-top:20px">
    <h2>Change order</h2>
    <p class="hint" style="margin:6px 0 16px">The contract value moved after this deal was paid on.
    ${co.state === 'applied' ? 'It has been applied, so only the difference is paid out.'
      : 'Nothing has been paid on the difference yet.'}</p>
    <div class="metricgrid" style="margin-bottom:20px">
      <div class="metric"><span class="mlabel">Paid on</span><span class="mval xs">${fmt0(d.baseImplied)}</span></div>
      <div class="metric"><span class="mlabel">Contract value now</span><span class="mval xs">${fmt0(d.value)}</span></div>
      <div class="metric"><span class="mlabel">Change</span>
        <span class="mval xs" style="color:${co.delta < 0 ? 'var(--crit)' : 'var(--good)'}">${fmt0(co.delta)}</span></div>
      <div class="metric"><span class="mlabel">Status</span>
        <span style="margin-top:8px"><span class="pill ${co.state === 'applied' ? 'info' : 'warn'}">${co.state === 'applied' ? 'Applied' : 'Not applied'}</span></span></div>
    </div>
    <div class="scroll"><table><thead><tr><th>What it changes</th><th>Who</th><th class="r">Amount</th></tr></thead>
      <tbody>
        ${e.setter ? row('Setter commission at ' + pct(d.hourly ? S.rates.hourly : S.rates.canvasser), d.canvasser, e.setter) : ''}
        ${e.closer ? row('Closer commission at ' + pct(S.rates.closer), d.closer, e.closer) : ''}
        ${e.recruit.map(l => row('Recruiting ' + l.lvl + ' on ' + esc(l.on), l.to, l.amt)).join('')}
        ${e.override.map(l => row('Override &middot; ' + esc(l.tier) + ', ' + esc(l.region), l.to, l.amt)).join('')}
      </tbody>
      <tfoot><tr><td colspan="2">Total effect &middot; ${fmt(e.setter + e.closer)} commission, ${fmt(bon)} bonuses</td>
        <td class="r">${fmt(e.total)}</td></tr></tfoot></table></div>
    ${co.state === 'applied' ? `<p class="hint" style="margin:16px 0 0">Commission
      ${co.commRun ? 'trues up in the ' + dshort(co.commRun) + ' run' : 'is folded into the ' + dshort(d.run) + ' run, which has not gone out yet'}.
      Bonuses ${co.bonusRun ? 'true up in the ' + dshort(co.bonusRun) + ' bonus run'
        : BONUS_OF.get(d.month) ? 'are folded into the ' + dshort(BONUS_OF.get(d.month)) + ' bonus run, which has not gone out yet' : 'are unaffected'}.</p>` : ''}
    ${admin ? `<div style="display:flex;gap:10px;margin-top:18px">
      ${co.state === 'applied' ? `<button class="btn ghost" data-co="undo:${d.id}">Undo</button>`
        : `<button class="btn" data-co="apply:${d.id}">Apply change order</button>`}</div>` : ''}
  </div>`;
}


/* ---- summer weekly bonus, on the run and as an office leaderboard ---- */
function summerCard(sh) {
  const months = summerMonthsFor(sh.date);
  if (!SUMMER.on) return '';
  const inRun = months.length;
  const rows = [];
  months.forEach(m => summerWeeks(m).forEach(x => { if (x.total) rows.push(Object.assign({ month: m }, x)); }));
  const mine = rows.filter(r => scopeName(r.name));
  const total = mine.reduce((a, r) => a + r.total, 0);

  /* program-wide leaderboard, grouped by office */
  const all = summerWeeks(null).filter(r => r.qualifying > 0 && scopeName(r.name));
  const offices = [...new Set(all.map(r => (byName.get(r.name) || {}).team || 'Unassigned'))].sort();
  return `<div class="card">
    <div class="chead"><h2>Summer weekly bonus</h2>
      ${inRun ? `<span class="pill info">${fmt0(total)} in this run</span>` : '<span class="pill plain">Not in this run</span>'}
      <div class="spacer"></div>
      <span class="mlabel">2 deals in a Sun-Sat week adds ${pct(SUMMER.tier2)} &middot; 3 or more adds ${pct(SUMMER.tier3)}</span></div>
    <div class="cbody" style="padding-top:0">
      <p class="hint" style="margin:0 0 16px">Setters only, on the deals they set. A week counts when the setter has
      two or more closed deals in it, Sunday to Saturday. The bonus is that week&rsquo;s contract value at the tier rate,
      <b>on top of the setter commission they were already paid</b> &mdash; so a three-deal week is
      ${pct(S.rates.canvasser)} plus ${pct(SUMMER.tier3)}, ${pct(S.rates.canvasser + SUMMER.tier3)} in all.
      Weeks with one deal or none pay nothing. Self-generated deals still count as a set.
      A month&rsquo;s weeks are payable in the following month&rsquo;s bonus run &mdash; ${monLabel(months[0] || MONTHS[0])}
      pays ${months.length ? dshort(sh.date) : 'in its own run'}.</p>
      ${inRun ? `<div class="scroll"><table>
        <thead><tr><th class="idx">#</th><th>Setter</th><th>Office</th><th>Month</th>
          <th class="r">Qualifying weeks</th><th class="r">Deals earning</th><th class="r">Bonus</th><th></th></tr></thead>
        <tbody>${mine.map((r, i) => { const e = byName.get(r.name) || {}; return `<tr class="clickable"
          data-setter="${esc(r.name + '|' + r.month)}" tabindex="0">
          <td class="idx">${i + 1}</td><td>${who2(r.name)}</td>
          <td class="muted">${esc(e.team || '&mdash;')}</td>
          <td class="muted">${monLabel(r.month)}</td>
          <td class="n r">${r.qualifying}</td><td class="n r">${r.deals}</td>
          <td class="n r"><b>${fmt(r.total)}</b></td>
          <td class="r muted">${S.openSetter === r.name + '|' + r.month ? 'hide' : 'weeks'}</td></tr>
          ${S.openSetter === r.name + '|' + r.month ? `<tr><td></td><td colspan="7" style="background:var(--card-2)">
            <table style="margin:6px 0"><thead><tr><th>Opportunity</th><th>Closed</th><th>Qualifying week</th>
              <th class="r">Contract value</th><th class="r">Base paid</th><th class="r">Bonus tier</th>
              <th class="r">Extra earned</th></tr></thead>
            <tbody>${r.weeks.filter(w => w.qualifying).flatMap(w => w.deals.map(d => `<tr class="clickable"
              data-deal="${d.id}" tabindex="0">
              <td>${esc(d.opp)}</td>
              <td class="n muted">${dshort(d.close)}</td>
              <td class="muted">${weekLabel(w.week)}<div class="sub">${w.count} deals set that week</div></td>
              <td class="n r">${fmt0(comBase(d))}</td>
              <td class="n r muted">${fmt(d.canvPay)} at ${pct(w.baseRate)}</td>
              <td class="n r"><span class="pill ${w.count >= 3 ? 'warn' : 'good'}">+${pct(w.rate)}</span></td>
              <td class="n r"><b>${fmt(comBase(d) * w.rate)}</b></td></tr>`)).join('')}</tbody>
            <tfoot><tr><td colspan="6">${r.deals} deals across ${r.qualifying} qualifying weeks</td>
              <td class="r">${fmt(r.total)}</td></tr></tfoot></table></td></tr>` : ''}`;

        <tfoot><tr><td colspan="6">${mine.length} setter${mine.length === 1 ? '' : 's'}</td>
          <td class="r">${fmt(total)}</td><td></td></tr></tfoot></table></div>`
      : `<p class="muted" style="margin:0 0 8px">This run carries no summer bonus. It pays with the monthly bonuses
         &mdash; next in the ${nextBonusRun() ? dshort(nextBonusRun()) : 'next'} run.</p>`}

/* ---- what has to be settled before Thursday ---- */
function freezeCard(sh) {
  const next = firstOpenRun();
  if (sh.state !== 'open') {
    return `<div class="note ${sh.state === 'paid' ? 'good' : ''}">
      <span class="tag">${sh.state === 'paid' ? 'Paid ' + dshort(sh.date) : 'Frozen ' + freezeLabel(sh.date)}</span>
      This run is locked${sh.state === 'frozen' ? ' and pays ' + dshort(sh.date) : ''}. Change orders, holds and
      adjustments entered now go into the <b>${next ? dshort(next) : 'next'}</b> run instead &mdash; nothing here
      can be rewritten after the freeze.</div>`;
  }
  const pend = coPending().length;
  const holds = allHolds().length;
  const adjs = ADJ.filter(a => a.run === sh.date).length;
  const left = untilFreeze(sh.date);
  const item = (label, n, ok, action) => `<div class="rate"><div class="rl">
      <b>${label}</b><div class="sub">${ok}</div></div>
    <span class="pill ${n ? 'warn' : 'good'}">${n || 'Clear'}</span>

    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">

    it cannot &mdash; late entries roll to the next run and show up there as a true-up.</p>

    ${item('Commission on hold', holds, holds ? fmt0(allHolds().reduce((a, h) => a + h.amt, 0)) + ' withheld across every run' : 'Nothing withheld')}

    <div class="rate"><div class="rl"><b>Deals in this run</b>

    <span class="pill good">${sh.deals.length}</span></div>

      <span class="pill info">${fmt0(sh.rows.reduce((a, r) => a + r.bonus, 0))}</span></div>` : ''}
  </div>`;
}

/* ---- hold controls for one deal ---- */
function holdCard(d) {
  const h = HOLDS.get(d.id) || {};
  const admin = S.role === 'admin';
  const leg = (name, key) => {
    const st = legState(d, key), amt = legAmt(d, key), person = legWho(d, key);
    if (!amt) return '';
    return `<div class="rate"><div class="rl">
        <b>${name} &mdash; ${esc(person)}</b>
        <div class="sub">${st === 'held' ? 'Withheld from every run since ' + dshort(h.at) + (h.by ? ' by ' + esc(h.by) : '') + (h.reason ? ' &middot; ' + esc(h.reason) : '')
          : st === 'released' ? 'Released &mdash; pays in the ' + dshort(legRun(d, key)) + ' run'
          : 'Pays in the ' + dshort(d.run) + ' run'}</div></div>
      <b class="n" style="${st === 'held' ? 'color:var(--crit)' : ''}">${fmt(amt)}</b>
      <span class="pill ${st === 'held' ? 'crit' : st === 'released' ? 'info' : 'good'}">${st === 'held' ? 'On hold' : st === 'released' ? 'Released' : 'Payable'}</span>
      ${admin && firstOpenRun() ? (st === 'held'
        ? `<button class="btn ghost" data-release="${d.id}:${key}">Release</button>`
        : `<button class="btn ghost" data-hold="${d.id}:${key}">Hold</button>`) : ''}</div>`;
  };
  return `<div class="card pad" style="margin-top:20px">
    <h2>Commission hold</h2>
    <p class="hint" style="margin:6px 0 8px">Holding a leg keeps it out of every pay run and flags it as not paid for
    that person. The setter and the closer are held separately. Releasing pays it in the next open run rather than
    back-dating it into a run that has frozen. A hold placed after the freeze takes effect from the
    ${firstOpenRun() ? dshort(firstOpenRun()) : 'next'} run.</p>
    ${admin ? `<div class="rate" style="border-bottom:1px solid var(--line-2)">
      <div class="rl"><b>Reason</b><div class="sub">Shows on the hold list and on their statement</div></div>
      <select class="pick" id="holdReason" aria-label="Hold reason">
        ${HOLD_REASONS.map(r => `<option ${h.reason === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
    </div>` : ''}
    ${leg('Setter commission', 'setter')}
    ${leg('Closer commission', 'closer')}
    ${admin && !h.setter && !h.closer && d.canvPay && d.closerPay
      ? `<div style="padding-top:14px"><button class="btn" data-hold="${d.id}:both">Hold both legs</button></div>` : ''}
  </div>`;
}

/* ====================== wiring ====================== */
/* on a phone each row becomes a stacked card, so every cell needs its column name */
function labelTables() {
  view.querySelectorAll('table').forEach(t => {
    const ths = [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/\s+/g, ' ').trim());
    if (!ths.length) return;
    t.classList.add('stacked');
    t.querySelectorAll('tbody tr').forEach(tr => {
      const tds = [...tr.children];
      if (tds.length === 1 && tds[0].hasAttribute('colspan')) return;
      let lead = -1;
      tds.forEach((td, i) => {
        const label = ths[i] || '';
        td.setAttribute('data-label', /^[#\s]*$/.test(label) ? '' : label);
        if (lead < 0 && !td.classList.contains('idx') && td.textContent.trim()) lead = i;
      });
      if (lead >= 0) tds[lead].classList.add('lead');
    });
  });
}

/* one gate for everything that writes: only a full admin gets live controls */
function lockControls() {
  if (canEditAll()) return;
  view.querySelectorAll('input,select,textarea').forEach(el => {
    if (el.classList.contains('search')) return;
    el.disabled = true;
    el.setAttribute('aria-disabled', 'true');
    el.title = 'Read-only access';
  });
}
function render() {
  recompute(); sheetCache.clear();
  renderNav(); renderContext();
  if (S.dealFocus != null) view.innerHTML = dealPanel(S.dealFocus);
  else if (S.focus) view.innerHTML = V.person();
  else if (S.role === 'rep' && S.view === 'runs') { S.focus = S.rep; renderContext(); view.innerHTML = V.person(); }
  else view.innerHTML = (V[S.view] || V.runs)();
  labelTables(); lockControls();
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', ev => {
  const t = ev.target.closest ? ev.target.closest('[data-nav],[data-df],[data-focus],[data-deal],[data-act],[data-step],[data-hold],[data-release],[data-adjdel],[data-co],[data-setter],[data-panel],[data-ptab],[data-adderq]') : null;
  if (!t) return;
  ev.preventDefault();
  if (t.dataset.nav) { S.focus = null; S.dealFocus = null; S.view = t.dataset.nav; S.q = ''; return render(); }
  if (t.dataset.step) {
    const n = +t.dataset.step;
    if (n < 0 || n >= RUNDATES2.length) return;
    S.run = RUNDATES2[n]; return render();
  }
  if (t.dataset.df) { S.dealFilter = t.dataset.df; return render(); }
  if (t.dataset.ptab) { S.ptab = t.dataset.ptab; S.addAdj = null; return render(); }
  if (t.dataset.adderq) { S.adderQ = t.dataset.adderq; S.ptab = 'adder'; return render(); }
  if (t.dataset.panel !== undefined) {
    S.panel = S.panel === t.dataset.panel || !t.dataset.panel ? null : t.dataset.panel;
    S.addAdj = null;
    return render();
  }
  if (t.dataset.setter) {
    S.openSetter = S.openSetter === t.dataset.setter ? null : t.dataset.setter;
    return render();
  }
  if (t.dataset.co) {
    const v = t.dataset.co;
    if (v === 'all') { S.coAll = true; return render(); }
    if (v === 'less') { S.coAll = false; return render(); }
    if (S.role !== 'admin') return;
    const p = v.split(':');
    const id = +p[1], d = DEALS[id];
    if (!d) return;
    const before = CO.get(id) ? Object.assign({}, CO.get(id)) : null;
    applyCO(id, p[0] === 'apply' ? 'applied' : 'pending');
    render();
    save(p[0] === 'apply' ? 'changeorder.apply' : 'changeorder.undo', dealKey(d), {},
      () => { if (before) CO.set(id, before); });
    return;
  }
  if (t.dataset.adjdel) {
    if (S.role !== 'admin') return;
    const i = ADJ.findIndex(a => a.id === t.dataset.adjdel);
    if (i < 0 || isApproved(ADJ[i].run)) return render();
    const gone = ADJ[i], at = i;
    ADJ.splice(i, 1);
    render();
    /* only a saved adjustment has an event to remove; a seeded one is dataset */
    if (String(gone.id).charAt(0) === 'e') {
      save('adjustment.remove', String(gone.id).slice(1), {}, () => ADJ.splice(at, 0, gone));
    }
    return;
  }
  const act = t.dataset.act || '';
  if (act.indexOf('adjopen:') === 0) { S.addAdj = act.slice(8); S.adjError = null; return render(); }
  if (act === 'adjcancel') { S.addAdj = null; S.adjError = null; return render(); }
  if (act.indexOf('adjsave:') === 0) {
    if (S.role !== 'admin') return;
    const key = act.slice(8);
    let runDate = RUNDATES2.indexOf(key) >= 0 ? key : S.run;
    if (isApproved(runDate)) runDate = firstOpenRun();
    const locked = RUNDATES2.indexOf(key) >= 0 ? null : key;
    const sel = document.getElementById('adjPerson');
    const person = locked || (sel && sel.value);
    const kind = (document.getElementById('adjKind') || {}).value || ADJ_KINDS[0][0];
    const amt = Math.abs(parseFloat((document.getElementById('adjAmount') || {}).value) || 0);
    const note = (((document.getElementById('adjNote') || {}).value) || '').trim();
    if (!person) { S.adjError = 'Pick a rep.'; return render(); }
    if (!amt) { S.adjError = 'Enter an amount greater than zero.'; return render(); }
    if (!runDate || isApproved(runDate)) { S.adjError = 'Every run is frozen. Nothing can be added right now.'; return render(); }
    const row = { id: 'a' + (adjSeq++), who: person, kind, label: note || kind,
      note: 'Added ' + dshort(D.frozenAt) + ' by ' + ADMIN_NOW, amount: adjSign(kind) * amt, run: runDate };
    ADJ.push(row);
    S.addAdj = null; S.adjError = null;
    render();
    save('adjustment', person, { type: kind, amount: amt, run: runDate, note: note },
      () => { const i = ADJ.indexOf(row); if (i >= 0) ADJ.splice(i, 1); })
      .then(ev => {
        if (!ev) return;
        row.id = 'e' + ev.id;                       /* so it can be removed later */
        row.note = 'Added ' + dshort(String(ev.at).slice(0, 10)) + ' by ' + ev.actor;
        toast('Adjustment saved');
        render();
      });
    return;
  }
  if (t.dataset.hold || t.dataset.release) {
    if (S.role !== 'admin' || !firstOpenRun()) return;
    const p = (t.dataset.hold || t.dataset.release).split(':');
    const id = +p[0], state = t.dataset.hold ? 'held' : 'released';
    const sel = document.getElementById('holdReason');
    const reason = sel ? sel.value : '';
    const d = DEALS[id];
    if (!d) return;
    const snap = holdSnapshot(id);
    const legs = p[1] === 'both' ? ['setter', 'closer'] : [p[1]];
    legs.forEach(leg => setHold(id, leg, state, reason));
    render();
    const undo = () => holdRestore(id, snap);
    legs.forEach(leg => save(state === 'held' ? 'hold' : 'release', dealKey(d),
      { leg: leg, reason: reason }, undo));
    return;
  }
  if (t.dataset.focus) { S.dealFocus = null; S.focus = t.dataset.focus; return render(); }
  if (t.dataset.deal) { S.dealFocus = +t.dataset.deal; return render(); }
  if (t.dataset.act === 'unfocus') {
    S.dealFocus = null;
    if (S.role === 'rep') { S.focus = S.rep; S.view = 'runs'; } else S.focus = null;
    return render();
  }
  if (t.dataset.act === 'theme') {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    return;
  }
  if (act === 'approve') {
    if (S.role !== 'admin') return;
    const run = S.run;
    FROZEN.add(run); S.addAdj = null;
    save('run.freeze', run, {}, () => FROZEN.delete(run));
    const next = firstOpenRun();
    render();
    view.insertAdjacentHTML('afterbegin', `<div class="note good"><span class="tag">Run frozen</span>
      The ${dshort(S.run)} run is locked ahead of Friday. Rates, contract values, holds and adjustments are captured
      as they stand and can no longer be edited. Anything entered from here rolls into the
      ${next && next !== S.run ? dshort(next) : 'next'} run.</div>`);
    return;
  }
  const msg = {
    approveX: 'Approving locks the run. Rates, contract values and adjustments are captured as paid, a payroll file is generated, and the run becomes read-only. A later edit to a contract value then shows up as a variance instead of quietly changing what was paid.',
    export: 'Downloads this run as a CSV for payroll, one row per person with commission, bonuses and adjustments broken out.',
    newadj: 'Opens a short form: who it is for, what kind (spiff, chargeback, manual commission, deduction), the amount, the run it lands in, and a reason that shows on their statement.',
    newuser: 'Opens the new-person form: plan, team, manager, and who recruited them at level 1 and level 2.'
  }[t.dataset.act];
  if (msg) {
    view.insertAdjacentHTML('afterbegin', `<div class="note"><span class="tag">Prototype</span>${msg}</div>`);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.clickable')) e.target.click();
  if (e.key === 'Escape' && (S.focus || S.dealFocus != null) && S.role !== 'rep') { S.focus = null; S.dealFocus = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'viewAs') {
    if (LIVE) return;
    const p = t.value.split(':');
    S.role = p[0]; S.focus = null; S.dealFocus = null; S.q = '';
    if (p[0] === 'admin' && p[1]) { S.admin = p[1]; ADMIN_NOW = p[1]; }
    if (p[0] === 'viewer' && p[1]) S.viewer = p[1];
    if (p[0] === 'manager') S.actor = p[1];
    if (p[0] === 'rep') S.rep = p[1];
    const ok = NAV[S.role].map(i => i[0]);
    if (!ok.includes(S.view)) S.view = ok[0];
    return render();
  }
  if (!canEditAll()) return;          /* every branch below writes; viewers stop here */
  if (t.dataset.seat) {
    const p = t.dataset.seat.split(':');
    setSeat(p[0], p.slice(1).join(':'), t.value || null);
    return render();
  }
  if (t.id === 'summerOn') { SUMMER.on = t.value === '1'; return render(); }
  if (t.id === 'summerStart') { SUMMER.start = t.value; return render(); }
  if (t.id === 'summerEnd') { SUMMER.end = t.value; return render(); }
  if (t.dataset.summer) { SUMMER[t.dataset.summer] = (+t.value || 0) / 100; return render(); }
  if (t.dataset.tier) {
    if (S.role !== 'admin') return;
    tierOf(t.dataset.tier).rate = (+t.value || 0) / 100;
    return render();
  }
  if (t.id === 'freezeDays') { S.freezeDays = +t.value; return render(); }
  if (t.id === 'freezeTime') { S.freezeTime = t.value; return render(); }
  if (t.dataset.adderrate) { S.adderRate = Math.max(0, +t.value || 0); return render(); }
  if (t.dataset.rate) { S.rates[t.dataset.rate] = (+t.value || 0) / 100; return render(); }
  if (t.dataset.rec) { const p = t.dataset.rec.split('.'); S.recruit[p[0]][p[1]] = (+t.value || 0) / 100; return render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'dealQ' || e.target.id === 'peopleQ') {
    const id = e.target.id, pos = e.target.selectionStart;
    S.q = e.target.value;
    view.innerHTML = S.focus ? V.person() : V[S.view]();
    labelTables();
    const f = document.getElementById(id);
    if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (err) { } }
  }
});
document.addEventListener('mousemove', e => {
  const m = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if (m) {
    tip.innerHTML = m.getAttribute('data-tip');
    tip.classList.add('on');
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 12) + 'px';
    tip.style.top = Math.max(e.clientY - 36, 8) + 'px';
  } else tip.classList.remove('on');
});
render();


  }
})();
</script>
