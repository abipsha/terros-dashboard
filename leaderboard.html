<style>
  :root {
    --ground: #F3F1EC; --card: #FFFFFF; --ink: #1B1B1B; --muted: #6F6E6A; --line: #ECEAE4; --line2: #F0EEE8;
    --tot: #FBFAF8; --gray: #EFEDE8; --gray2: #C9C7C1; --gray3: #9B9A95; --accent: #E4571F; --pale: #F8CDB9;
    --act-bg: #FBE7E0; --act-fg: #B4421A; --g2-bg: #D7F0EA; --g2-fg: #0F5F57; --green: #0F766E;
    --shadow: 0 1px 2px rgba(0,0,0,.04); --shadow2: 0 1px 2px rgba(0,0,0,.08);
    --field-bg: #FFFFFF;
  }
  html[data-theme="dark"] {
    --ground: #161615; --card: #1F1F1E; --ink: #F3F1EC; --muted: #A3A29D; --line: #2E2E2C; --line2: #2A2A28;
    --tot: #242423; --gray: #2C2C2A; --gray2: #4A4A47; --gray3: #8A8985; --accent: #E4571F; --pale: #5A2E1B;
    --act-bg: #3A2418; --act-fg: #F2A784; --g2-bg: #163A34; --g2-fg: #8FD9C8; --green: #5FC9B5;
    --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow2: 0 1px 2px rgba(0,0,0,.4);
    --field-bg: #1F1F1E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: Inter, system-ui, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--accent); }
  button { font-family: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 20px 48px; display: flex; flex-direction: column; gap: 16px; }

  html[data-theme="dark"] { --mark-opacity: .22; }

  .wrap { position: relative; z-index: 1; }
  @media print { body::before { display: none; } }
  .card { background: var(--card); background: color-mix(in srgb, var(--card) 82%, transparent); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .pad { padding: 16px 18px; }
  .cond { font-family: 'Roboto Condensed', sans-serif; font-weight: 800; line-height: 1; }
  .muted { color: var(--muted); }
  .tiny { font-size: 10px; }
  .lbl { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pill { display: inline-block; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; line-height: 1.3; white-space: nowrap; }
  .pill.productive { background: var(--ink); color: var(--card); }
  .pill.active { background: var(--act-bg); color: var(--act-fg); }
  .pill.inactive { background: var(--gray); color: var(--muted); }
  .pill.t4 { background: var(--accent); color: #FFFFFF; }
  .pill.t2 { background: var(--g2-bg); color: var(--g2-fg); }
  .pill.t1 { background: var(--gray); color: var(--muted); }
  .pill.t0 { background: transparent; color: var(--gray2); }
  .pill.role-d { background: var(--gray); color: var(--ink); }
  .pill.role-c { background: var(--act-bg); color: var(--act-fg); }
  .pill.role-s { background: var(--ink); color: var(--card); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--ground); border-radius: 999px; padding: 4px; }
  .card .seg { background: var(--ground); }
  .seg > button, .seg > a { display: inline-flex; align-items: center; justify-content: center; line-height: 1; font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: none; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; min-height: 32px; }
  .seg > .on { font-weight: 600; background: var(--ink); color: var(--card); }
  .seg.orange > .on { background: var(--accent); color: #FFFFFF; }
  .seg.white { background: var(--card); box-shadow: var(--shadow); }
  .seg.white > .on { background: var(--ink); color: var(--card); }
  .seg.soft > .on { background: var(--card); color: var(--ink); box-shadow: var(--shadow2); }
  .iconbtn { width: 36px; height: 36px; border: none; background: transparent; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
  .iconbtn:hover { background: var(--ground); }
  input[type=date], input[type=search], select {
    font-family: Inter, system-ui, sans-serif; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
    background: var(--field-bg); color: var(--ink); min-height: 32px;
  }
  html[data-theme="dark"] input[type=date] { color-scheme: dark; }
  .btn { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; min-height: 32px; }
  .btn:hover { border-color: var(--accent); }

  /* top bar */
  .topbar { padding: 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .brand { font-family: 'Roboto Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .brand span { font-family: Inter, sans-serif; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  .topnav { margin-left: auto; margin-right: auto; }
  .topright { display: flex; align-items: center; gap: 8px; }
  .signout svg { display: none; }

  /* title + period */
  .titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 0 4px; }
  .titlerow h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .titlerow h1 span { font-weight: 400; color: var(--muted); }
  .period { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .custom { display: none; align-items: center; gap: 6px; flex-wrap: wrap; }
  .custom.show { display: flex; }

  /* header block */
  .teamhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; padding: 2px 6px 0; }
  .teamhead .name { font-family: 'Roboto Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: -.01em; }
  .stats { display: flex; gap: 24px; margin-left: auto; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat .v { font-family: 'Roboto Condensed', sans-serif; font-weight: 800; font-size: 28px; line-height: 1; }
  .stat .l { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 14px; }
  .grid6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .kpi { display: flex; flex-direction: column; gap: 8px; }
  .kpi .v { font-family: 'Roboto Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; }
  .kpi .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .bignum { font-family: 'Roboto Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; white-space: nowrap; }
  .bigsub { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .mini { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 14px; }
  .minil { font-size: 9px; letter-spacing: .06em; color: var(--muted); }
  .cardhead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
  .cardhead .t { font-size: 13px; font-weight: 600; }
  .cardhead .t span { font-weight: 400; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 64px; }
  .bars > div { flex: 1; background: var(--line); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bars > div.cur { background: var(--accent); }
  .barlbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  .barlbl span { flex: 1; text-align: center; }
  .hr { border-top: 1px solid var(--line2); }

  /* tables */
  .tablebox { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.l, td.l { text-align: left; }
  th.c, td.c { text-align: center; }
  th.sep, td.sep { border-left: 1px solid var(--line); padding-left: 18px; }
  td { font-size: 12.5px; padding: 10px 10px; border-bottom: 1px solid var(--line2); text-align: right; white-space: nowrap; }
  tr.bold td { font-weight: 700; }
  tr.total td { font-weight: 700; border-bottom: none; border-top: 2px solid var(--line); background: var(--tot); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--ground); }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--ink); }
  .name a { font-weight: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* team tabs */
  .teamtabs { align-self: flex-start; }

  /* legend strip */
  .legend { display: flex; gap: 24px; flex-wrap: wrap; padding-top: 10px; align-items: flex-end; }
  .legend .k { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 13px; }

  /* drawer */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
  .drawer-bg.show { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100%); background: var(--ground); z-index: 21; transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
  .drawer.show { transform: translateX(0); }
  .avatar { width: 52px; height: 52px; border-radius: 999px; background: var(--ink); color: var(--card); display: flex; align-items: center; justify-content: center; font-family: 'Roboto Condensed', sans-serif; font-weight: 800; font-size: 18px; flex-shrink: 0; }

  .view { display: none; flex-direction: column; gap: 16px; }
  .view.show { display: flex; }
  .status { font-size: 11px; color: var(--muted); }
  .status.err { color: var(--act-fg); }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 13px; }
  .empty { padding: 14px 0; color: var(--muted); font-size: 12px; }
  .wk { display: flex; gap: 3px; }
  .wk > span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }

  @media (max-width: 1000px) {
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid5 .bignum { font-size: 22px; }
    .grid6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  /* bottom tab bar: phone only */
  .tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line); padding: 0 6px env(safe-area-inset-bottom, 10px); }
  .tabbar > a, .tabbar > button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; font-size: 10px; font-weight: 500; color: var(--muted); min-height: 50px; background: none; border: none; font-family: inherit; cursor: pointer; }
  .tabbar > .on { color: var(--ink); font-weight: 600; }
  @media (max-width: 700px) {
    /* ── phone layer: only this block changes the layout under 700px; iPad and desktop are untouched ── */
    body::before { background-size: 115vw auto; background-position: 35% 45%; }
    .wrap { padding: 10px 14px 96px; gap: 10px; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid6 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid5 { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .grid5 .bignum { font-size: 17px; }
    .grid5 .bigsub { font-size: 9px; }
    .card.pad { padding: 12px 14px; }
    .kpi { gap: 4px; }
    .kpi .v { font-size: 24px; }
    .kpi .row { flex-direction: column; align-items: flex-start; gap: 2px; font-size: 10px; }
    .teamhead { gap: 8px 12px; padding: 2px 2px 0; }
    .teamhead .name { font-size: 28px; }
    .stats { margin-left: auto; gap: 14px; }
    .stat .v { font-size: 22px; }
    .stat .l { font-size: 8px; }
    .topbar { padding: 8px 4px; background: transparent; box-shadow: none; gap: 8px; }
    .topbar .brand { font-size: 18px; }

<script>
/* ──────────────────────────────────────────────────────────────
   Leader Board — reads /api/leaderboard and renders three views.
   Revenue is contract value on Won accounts by closing date (Odoo).
   Field activity is Terros. Weekly bonus runs Sunday–Saturday:
   2 sets +2%, 3 or more +4% of the contract value set that week.
   ────────────────────────────────────────────────────────────── */
var API = '';                       // same origin
var S = { view: 'overview', period: 'this', start: '', end: '', team: '', roster: 'everyone', showInactive: false, data: null, loadSeq: 0, terrosPending: false, repSort: 'rev', repRole: 'all', repTeam: '', repStanding: '', repQ: '' };
var TEAM_ORDER = ['Northern Utah', 'Eastern Idaho', 'Southern Utah', 'Northern California'];

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('iconMoon').style.display = t === 'dark' ? 'none' : '';
  document.getElementById('iconSun').style.display = t === 'dark' ? '' : 'none';
  document.getElementById('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
}
function toggleTheme() {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('lb-theme', t); } catch (e) {}
}
(function () {
  var t = 'light';
  try { t = localStorage.getItem('lb-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  applyTheme(t);
})();

/* ---------- dates ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function fmtD(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function dshort(s) { if (!s) return ''; var d = parseD(s); return MON[d.getMonth()] + ' ' + d.getDate(); }
function dlong(s) { if (!s) return ''; var d = parseD(s); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function today() { return fmtD(new Date()); }
function sunOnOrBefore(s) { var d = parseD(s); d.setDate(d.getDate() - d.getDay()); return fmtD(d); }
function satOnOrAfter(s) { var d = parseD(s); d.setDate(d.getDate() + (6 - d.getDay())); return fmtD(d); }
function weeksTouching(start, end) {
  var out = [], cur = sunOnOrBefore(start), n = 1;
  while (cur <= end) {
    var e = addDays(cur, 6);
    out.push({ n: n++, start: cur, end: e, key: cur, label: dshort(cur) + ' – ' + dshort(e), current: today() >= cur && today() <= e, future: cur > today() });
    cur = addDays(cur, 7);
  }
  return out;
}
function monthRange(offset) {
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset);
  var s = fmtD(d); var e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  var endS = fmtD(e); if (offset === 0 && endS > today()) endS = today();
  return { start: s, end: endS, label: MONL[d.getMonth()] + ' ' + d.getFullYear() };
}

/* ---------- formatting ---------- */
function money(n) { n = Math.round(n || 0); return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US'); }
function moneyK(n) { n = n || 0; if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M'; if (Math.abs(n) >= 1e3) return '$' + Math.round(n / 1e3) + 'K'; return '$' + Math.round(n); }
function num(n) { return (n || 0).toLocaleString('en-US'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
function initials(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase(); }
function blank(v) { return v == null || v === '' || v === 0 ? '' : v; }

/* ---------- data load ---------- */
function setPeriod(p) {
  S.period = p;
  document.querySelectorAll('#periodSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === p); });
  document.getElementById('customBox').classList.toggle('show', p === 'custom');
  if (p === 'this' || p === 'last') { var r = monthRange(p === 'this' ? 0 : -1); S.start = r.start; S.end = r.end; load(false); }
  else { document.getElementById('fromDate').value = S.start; document.getElementById('toDate').value = S.end; }
}
function applyCustom() {
  var f = document.getElementById('fromDate').value, t = document.getElementById('toDate').value;
  if (!f || !t || f > t) { alert('Pick a From date on or before the To date.'); return; }
  S.start = f; S.end = t; load(false);
}
function periodLabel() {
  var r0 = monthRange(0), r1 = monthRange(-1);
  if (S.start === r0.start && S.end === r0.end) return r0.label + ', month to date';
  if (S.start === r1.start && S.end === r1.end) return r1.label;
  return dlong(S.start) + ' – ' + dlong(S.end);
}
function load(force) {
  document.getElementById('loading').style.display = '';
  document.getElementById('statusLine').textContent = 'Loading ' + periodLabel() + '…';
  document.getElementById('statusLine').className = 'status';
  var seq = ++S.loadSeq;
  function get(part) {
    var url = API + '/api/leaderboard?start=' + S.start + '&end=' + S.end + '&part=' + part + (force ? '&force=1' : '');
    return fetch(url, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
      // the server answers an expired session with a redirect to /login; follow it as a page, not as data
      if (r.status === 401 || r.status === 403 || (r.redirected && r.url.indexOf('/login') >= 0)) { location.href = '/login'; throw new Error('sign in'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  // revenue first (Odoo, quick), then the field activity (Terros, slower) fills in
  get('deals')
    .then(function (j) {
      if (seq !== S.loadSeq) return;
      j.terros = null; S.data = j; S.terrosPending = true; derive(); render();
      return get('terros').then(function (t) {
        if (seq !== S.loadSeq) return;
        S.data.terros = t.terros; S.terrosPending = false; derive(); render();
      }).catch(function (e) {
        if (seq !== S.loadSeq) return;
        S.data.terros = { period: { ok: false, byName: {}, error: e.message }, yesterday: { ok: false, byName: {}, error: e.message } };
        S.terrosPending = false; derive(); render();
      });
    })
    .catch(function (e) {
      if (seq !== S.loadSeq) return;
      document.getElementById('loading').style.display = 'none';
      var st = document.getElementById('statusLine'); st.className = 'status err';
      st.textContent = 'Could not load the board: ' + e.message + '. Try Refresh; if it keeps happening, tell Abipsha.';
    });
}

/* ---------- derive everything from the payload ---------- */
var D = {};   // derived
function derive() {
  var j = S.data;
  var start = j.period.start, end = j.period.end;
  var deals = j.deals || [];
  var inRange = deals.filter(function (d) { return d.date >= start && d.date <= end; });
  var weeks = weeksTouching(start, end);
  var terP = (j.terros && j.terros.period && j.terros.period.byName) || {};
  var terY = (j.terros && j.terros.yesterday && j.terros.yesterday.byName) || {};
  var roster = j.roster || [];
  var teams = j.teams || TEAM_ORDER;

  // reps: everyone on the roster plus anyone named on a deal in the window
  var reps = {};
  function rep(name) {
    if (!name) return null;
    var k = norm(name);
    if (!reps[k]) reps[k] = { name: name, key: k, team: '', role: '', active: true, onRoster: false, closed: [], set: [], selfgen: [], lastSale: '', manager: '', start: '', odooId: null, dealTeams: {} };
    return reps[k];
  }
  roster.forEach(function (e) { var r = rep(e.name); if (!r) return; r.onRoster = true; r.team = e.team || r.team; r.role = e.role || r.role; r.active = e.active !== false; r.manager = e.manager || ''; r.start = e.start || ''; r.odooId = e.odooId || null; });
  deals.forEach(function (d) {
    var c = rep(d.closer), s = rep(d.setter);
    var self = c && s && c === s;
    if (c) { c.dealTeams[d.team] = (c.dealTeams[d.team] || 0) + 1; }
    if (s && s !== c) { s.dealTeams[d.team] = (s.dealTeams[d.team] || 0) + 1; }
    if (d.date >= start && d.date <= end) {
      if (c) { c.closed.push(d); if (!c.role) c.role = 'Market Director'; }
      if (s && !self) { s.set.push(d); if (!s.role) s.role = 'Market Coordinator'; }
      if (self) { c.set.push(d); c.selfgen.push(d); }
    }
    if (c && d.date > c.lastSale) c.lastSale = d.date;
    if (s && d.date > s.lastSale) s.lastSale = d.date;
  });
  (j.previous && j.previous.deals || []).forEach(function (d) {
    var c = rep(d.closer), s = rep(d.setter);
    if (c && d.date > c.lastSale) c.lastSale = d.date;
    if (s && d.date > s.lastSale) s.lastSale = d.date;
  });
  var wkNow = { s: sunOnOrBefore(today()), e: satOnOrAfter(today()) };
  var cutoff30 = addDays(end, -30);
  Object.keys(reps).forEach(function (k) {
    var r = reps[k];
    // team = where the rep's accounts are; the Odoo region is only the fallback for a rep with no sales
    // (a rep who moved offices is often still filed under the old region in Odoo)
    var best = '', bn = 0; Object.keys(r.dealTeams).forEach(function (t) { if (t && r.dealTeams[t] > bn) { bn = r.dealTeams[t]; best = t; } });
    if (best && teams.indexOf(best) >= 0 && (!r.team || teams.indexOf(r.team) >= 0)) { if (r.team && r.team !== best) r.rosterTeam = r.team; r.team = best; }   // Inside Sales reps stay Inside Sales
    else if (!r.team) r.team = best;
    r.revClosed = r.closed.reduce(function (a, d) { return a + d.rev; }, 0);
    r.revSet = r.set.reduce(function (a, d) { return a + d.rev; }, 0);
    r.revSelf = r.selfgen.reduce(function (a, d) { return a + d.rev; }, 0);
    var seen = {}; r.accounts = [];
    r.closed.concat(r.set).forEach(function (d) { if (!seen[d.id]) { seen[d.id] = 1; r.accounts.push(d); } });
    r.accounts.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    r.adders = r.accounts.reduce(function (a, d) { return a + (d.adders || 0); }, 0);
    r.rev = r.revClosed + r.revSet - r.revSelf;      // revenue the rep touched, each account once
    // weekly bonus, per Sunday–Saturday week
    r.weeks = weeks.map(function (w) {
      var ds = deals.filter(function (d) { return norm(d.setter) === k && d.date >= w.start && d.date <= w.end; });
      var val = ds.reduce(function (a, d) { return a + d.rev; }, 0);
      var n = ds.length, rate = n >= 3 ? .04 : n === 2 ? .02 : 0;
      return { n: n, rate: rate, value: val, bonus: val * rate, deals: ds, week: w };
    });
    r.bonus = r.weeks.reduce(function (a, w) { return a + w.bonus; }, 0);
    r.setsAll = r.weeks.reduce(function (a, w) { return a + w.n; }, 0);
    var cw = r.weeks.filter(function (w) { return w.week.current; })[0];
    r.curWeek = cw || null;
    // Terros
    r.ter = terP[k] || null;
    r.yday = terY[k] || null;
    // standing
    var sale = r.lastSale;
    r.standing = sale && sale >= wkNow.s ? 'Productive' : (sale && sale >= cutoff30) || (r.ter && (r.ter.knocks || r.ter.pitches)) ? 'Active' : 'Inactive';
  });
  D.reps = Object.keys(reps).map(function (k) { return reps[k]; });
  D.weeks = weeks; D.inRange = inRange; D.teams = teams;
  D.prevDeals = (j.previous && j.previous.deals) || [];
  // team summaries
  D.team = {};
  teams.forEach(function (t) {
    var tr = D.reps.filter(function (r) { return r.team === t && (r.active || r.accounts.length); });
    var td = inRange.filter(function (d) { return d.team === t; });
    var pd = D.prevDeals.filter(function (d) { return d.team === t; });
    D.team[t] = summarize(tr, td, pd);
    D.team[t].reps = tr;
  });
  D.company = summarize(D.reps.filter(function (r) { return r.active || r.accounts.length; }), inRange, D.prevDeals);
  D.company.reps = D.reps;
  if (!S.team || teams.indexOf(S.team) < 0) S.team = teams[0];
}
function summarize(reps, deals, prev) {
  var o = {};
  o.deals = deals.length; o.rev = deals.reduce(function (a, d) { return a + d.rev; }, 0);

  // weekly bonus: one row per coordinator with a dot per week
  var coords = reps.filter(function (r) { return r.setsAll > 0 && isCoordinatorRow(r); }).sort(function (a, b) { return b.bonus - a.bonus || b.setsAll - a.setsAll; });
  var hdr = '<div style="display:flex;align-items:center;gap:10px;padding-bottom:4px"><div style="flex:1"></div><div style="display:flex;gap:4px">' + D.weeks.map(function (w) { return '<span class="tiny" style="width:22px;text-align:center;' + (w.current ? 'color:var(--accent);font-weight:600' : 'color:var(--muted)') + '">' + (w.current ? 'now' : 'W' + w.n) + '</span>'; }).join('') + '</div><div style="width:54px"></div></div>';
  var bonusRows = coords.map(function (r) { return '<button type="button" class="prow" style="padding:6px 0" onclick="openRep(\'' + r.key + '\')"><div class="body"><div class="t">' + esc(r.name) + '</div></div>' + weekDots(r) + '<div class="val" style="width:54px"><div class="n">' + (r.bonus ? money(r.bonus) : '—') + '</div></div></button>'; }).join('');
  var legend = '<div class="tiny muted" style="border-top:1px solid var(--line2);padding:8px 0 6px"><span class="wdot t4" style="width:10px;height:10px;vertical-align:middle"></span> 3+ sets +4% &nbsp; <span class="wdot t2" style="width:10px;height:10px;vertical-align:middle"></span> 2 sets +2% &nbsp; <span class="wdot t1" style="width:10px;height:10px;vertical-align:middle"></span> 1 set. Self-gen counts as a set.</div>';
  var bonus = pcard('Weekly bonus', 'Sun – Sat', (coords.length ? hdr + bonusRows : '<div class="empty">No accounts set in this period.</div>') + legend, '<span class="tiny muted">' + money(o.bonus) + ' MTD · ' + money(o.bonusWeek) + ' this week</span>');
  // roster
  var mode = S.roster;
  var list = reps.filter(function (r) { return mode === 'everyone' ? true : mode === 'directors' ? isDirectorRow(r) : isCoordinatorRow(r); });
  var hidden = list.filter(function (r) { return r.standing === 'Inactive'; }).length;
  if (!S.showInactive) list = list.filter(function (r) { return r.standing !== 'Inactive'; });
  list.sort(function (a, b) { return (mode === 'coordinators' ? b.revSet - a.revSet : mode === 'directors' ? b.revClosed - a.revClosed : b.rev - a.rev) || a.name.localeCompare(b.name); });
  var toggle = '<div class="seg soft" style="padding:3px"><button class="' + (mode === 'everyone' ? 'on' : '') + '" style="padding:6px 10px;min-height:30px;font-size:11px" onclick="S.roster=\'everyone\';render()">All</button><button class="' + (mode === 'directors' ? 'on' : '') + '" style="padding:6px 10px;min-height:30px;font-size:11px" onclick="S.roster=\'directors\';render()">Directors</button><button class="' + (mode === 'coordinators' ? 'on' : '') + '" style="padding:6px 10px;min-height:30px;font-size:11px" onclick="S.roster=\'coordinators\';render()">Coordinators</button></div>';
  var rows = list.map(function (r) {
    var tr = r.ter || {};
    var line1 = (r.closed.length ? r.closed.length + ' closed' : '') + (r.closed.length && r.set.length ? ' · ' : '') + (r.set.length ? r.set.length + ' set' : '') + (r.selfgen.length ? ' · ' + r.selfgen.length + ' self-gen' : '') + (r.bonus ? ' · bonus ' + money(r.bonus) : '') + (r.lastSale ? ' · last sale ' + dshort(r.lastSale) : '');
    var line2 = r.ter ? num(tr.knocks) + ' knocks · ' + num(tr.pitches) + ' pitches · ' + num(tr.sits) + ' sits · ' + (tr.hours || 0).toFixed(0) + ' h' : (S.terrosPending ? 'field activity loading…' : 'no Terros reading');
    return prow({ key: r.key, title: r.name, pill: rolePill(r.role), sub: line1, sub2: line2, value: r.rev ? money(r.rev) : '', standing: r.standing });
  }).join('');
  var roster = pcard('Roster', '', (rows || '<div class="empty">Nobody on this team has a sale or a Terros reading in the period.</div>') + (hidden ? '<button type="button" class="seeall" onclick="S.showInactive=!S.showInactive;render()">' + (S.showInactive ? 'Hide ' : 'Show ') + hidden + ' inactive</button>' : ''), toggle);
  document.getElementById('view-teams').innerHTML = tabs + head + kpiCards(o, S.period === 'this' ? 'Revenue, MTD' : 'Revenue') + terrosCard(o) + bonus + roster;
}
function renderRepsPhoneList(list) {
  var rows = list.map(function (r, i) {
    var tr = r.ter || {};
    var line = esc(r.team) + ' · ' + (r.closed.length ? r.closed.length + ' closed' : '') + (r.closed.length && r.set.length ? ' · ' : '') + (r.set.length ? r.set.length + ' set' : '') + (r.selfgen.length ? ' · ' + r.selfgen.length + ' self-gen' : '') + (r.bonus ? ' · bonus ' + money(r.bonus) : '') + (r.ter ? ' · ' + num(tr.knocks) + ' knocks' : '');
    return prow({ key: r.key, rank: i + 1, title: r.name, pill: r.role ? '<span class="pill ' + (r.role === 'Market Director' ? 'role-d' : 'role-c') + '">' + (r.role === 'Market Director' ? 'MD' : 'MC') + '</span>' : '', sub: line, value: r.rev ? money(r.rev) : '', standing: r.standing });
  }).join('');
  return '<div style="padding-bottom:6px"><div class="tiny muted" style="padding-bottom:6px">' + list.length + ' reps · ' + esc(dshort(S.start) + ' – ' + dshort(S.end)) + ' · MD = Market Director, MC = Market Coordinator. Tap a rep for their accounts.</div>' + (rows || '<div class="empty">No reps match.</div>') + '</div>';
}
/* ----- rep drawer ----- */
function openRep(key) {
  var r = D.reps.filter(function (x) { return x.key === key; })[0]; if (!r) return;
  var base = S.data.odooBase || 'https://myvivid.odoo.com/odoo/crm/';
  var rank = D.reps.filter(function (x) { return x.rev > 0; }).sort(function (a, b) { return b.rev - a.rev; }).map(function (x) { return x.key; }).indexOf(key) + 1;
  var t = r.ter || {}, y = r.yday || {};
  var header = '<div style="display:flex;align-items:center;gap:12px"><button class="iconbtn" aria-label="Close" onclick="closeRep()"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button><div class="tiny muted">Reps › ' + esc(r.team || '—') + '</div></div>' +
    '<div class="teamhead"><div style="display:flex;align-items:center;gap:14px;flex:1 1 300px;min-width:0"><div class="avatar" aria-hidden="true">' + esc(initials(r.name)) + '</div><div style="min-width:0"><div class="name" style="font-size:32px">' + esc(r.name) + '</div><div class="tiny muted" style="margin-top:6px">' + esc([r.role, r.team, r.manager ? 'reports to ' + r.manager : '', r.start ? 'started ' + dlong(r.start) : ''].filter(Boolean).join(' · ')) + '</div></div></div>' +
    '<div class="stats">' + (rank ? '<div class="stat"><div class="v">#' + rank + '</div><div class="l">Company</div></div>' : '') + '<div class="stat"><div class="v">' + moneyK(r.rev) + '</div><div class="l">' + (S.period === 'this' ? 'MTD' : 'Revenue') + '</div></div><div class="stat"><div class="v">' + standingPill(r.standing) + '</div><div class="l">Standing</div></div></div></div>';
  var kp = '<div class="grid4">' + [['Revenue closed', money(r.revClosed), r.closed.length + ' accounts'], ['Revenue set', money(r.revSet), r.set.length + ' accounts'], ['Self-gen', num(r.selfgen.length), money(r.revSelf)], ['Vivid Adders', num(r.adders), 'on ' + r.accounts.filter(function (d) { return d.adders; }).length + ' accounts']]
    .map(function (c) { return '<div class="card pad kpi"><div class="lbl">' + c[0] + '</div><div class="v">' + c[1] + '</div><div class="row"><span>' + esc(c[2]) + '</span></div></div>'; }).join('') + '</div>';
  var wk = '<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><div class="cardhead"><div class="t">Weekly bonus <span>Sun – Sat</span></div><div class="tiny muted">' + (r.bonus ? money(r.bonus) + ' in the period' : 'nothing earned in the period') + '</div></div>' +
    r.weeks.map(function (w) { return '<div style="display:flex;align-items:center;gap:10px"><div class="tiny muted" style="width:90px;flex-shrink:0">' + esc(w.week.label) + '</div><div class="wk" style="flex:1">' + [1, 2, 3].map(function (i) { return '<span style="background:' + (w.n >= i ? (w.n >= 3 ? 'var(--accent)' : w.n === 2 ? 'var(--green)' : 'var(--gray2)') : 'var(--line)') + '"></span>'; }).join('') + '</div>' + (w.week.future ? '<span class="muted tiny">upcoming</span>' : tierPill(w.n)) + '<div class="mini" style="width:60px;text-align:right">' + (w.bonus ? money(w.bonus) : '—') + '</div></div>'; }).join('') + '</div>';
  var ter = '<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><div class="cardhead"><div class="t">Field activity <span>Terros</span></div><div class="tiny muted">' + esc(dshort(S.start) + ' – ' + dshort(S.end)) + '</div></div>' +
    '<div class="grid5">' + [[num(t.knocks || 0), 'knocks'], [num(t.pitches || 0), 'pitches'], [num(t.sits || 0), 'sits'], [(t.hours || 0).toFixed(0), 'hours'], [t.days || t.daysActive || 0, 'days worked']].map(function (c) { return '<div><div class="bignum" style="font-size:22px">' + c[0] + '</div><div class="bigsub">' + c[1] + '</div></div>'; }).join('') + '</div>' +
    '<div class="tiny muted hr" style="padding-top:8px">Yesterday: ' + (r.yday ? num(y.knocks || 0) + ' knocks · ' + num(y.pitches || 0) + ' pitches · ' + num(y.sits || 0) + ' sits · ' + (y.hours || 0).toFixed(1) + ' h · first knock ' + (y.firstKnock || '—') : 'no activity logged') + '</div></div>';
  var acc = '<div class="card" style="padding:16px 18px 6px"><div class="cardhead" style="padding-bottom:8px"><div class="t">Accounts <span>closed or set, ' + esc(dshort(S.start) + ' – ' + dshort(S.end)) + '</span></div><div class="tiny muted">Contract value is what Odoo holds today.</div></div><div class="tablebox"><table><thead><tr><th class="l">Account</th><th class="l">Closed</th><th class="l">Role</th><th class="l">With</th><th class="l">Stage</th><th>Contract value</th><th>Adders</th><th class="l">Bonus week</th><th class="l">Odoo</th></tr></thead><tbody>' +
    (r.accounts.length ? r.accounts.map(function (d) {
      var self = norm(d.closer) === norm(d.setter), isC = norm(d.closer) === r.key;
      var w = r.weeks.filter(function (x) { return d.date >= x.week.start && d.date <= x.week.end; })[0];
      var withWho = self ? '—' : isC ? 'set by ' + d.setter : 'closed by ' + d.closer;
      var bw = (!isC || self) && w ? w.week.label + (w.n >= 3 ? ', +4%' : w.n === 2 ? ', +2%' : w.week.current ? ', pending' : ', no bonus') : '—';
      return '<tr><td class="l">' + esc(d.name) + '</td><td class="l">' + esc(dshort(d.date)) + '</td><td class="l">' + rolePill(isC ? 'Market Director' : 'Market Coordinator', self) + '</td><td class="l">' + esc(withWho) + '</td><td class="l">' + esc(d.stage || '') + '</td><td class="num">' + money(d.rev) + '</td><td class="num">' + blank(d.adders) + '</td><td class="l">' + esc(bw) + '</td><td class="l"><a href="' + base + d.id + '" target="_blank" rel="noopener" style="color:var(--accent)">open</a></td></tr>';
    }).join('') + '<tr class="total"><td class="l">' + r.accounts.length + ' accounts</td><td></td><td></td><td></td><td></td><td class="num">' + money(r.accounts.reduce(function (a, d) { return a + d.rev; }, 0)) + '</td><td class="num">' + r.adders + '</td><td></td><td></td></tr>' : '<tr><td colspan="9" class="empty">No accounts in the period.</td></tr>') + '</tbody></table></div></div>';
  if (isPhone()) {
    var base2 = base;
    acc = pcard('Accounts', esc(dshort(S.start) + ' – ' + dshort(S.end)), (r.accounts.length ? r.accounts.slice().reverse().map(function (d) {
      var self = norm(d.closer) === norm(d.setter), isC = norm(d.closer) === r.key;
      var w = r.weeks.filter(function (x) { return d.date >= x.week.start && d.date <= x.week.end; })[0];
      var withWho = self ? 'self-gen' : isC ? 'set by ' + d.setter : 'closed by ' + d.closer;
      var bw = (!isC || self) && w ? ' · W' + w.n + (w.n >= 3 ? ' +4%' : w.n === 2 ? ' +2%' : '') : '';
      return '<a class="prow" href="' + base2 + d.id + '" target="_blank" rel="noopener"><div class="body"><div class="t">' + esc(d.name) + '</div><div class="s">' + esc(dshort(d.date) + ' · ' + withWho + bw + (d.adders ? ' · ' + d.adders + ' adder' + (d.adders > 1 ? 's' : '') : '')) + '</div></div><div class="val"><div class="n">' + money(d.rev) + '</div></div><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg></a>';
    }).join('') : '<div class="empty">No accounts in the period.</div>'), '<span class="tiny muted">' + r.accounts.length + ' · ' + money(r.accounts.reduce(function (a, d) { return a + d.rev; }, 0)) + '</span>');
    header = '<div style="display:flex;align-items:center;gap:10px"><div class="avatar" aria-hidden="true">' + esc(initials(r.name)) + '</div><div style="flex:1;min-width:0"><div class="name" style="font-family:\'Roboto Condensed\',sans-serif;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.name) + '</div><div class="tiny muted" style="margin-top:4px">' + esc([r.role, r.team].filter(Boolean).join(' · ')) + '</div></div><button class="iconbtn" aria-label="Close" onclick="closeRep()" style="background:var(--card);box-shadow:var(--shadow)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + standingPill(r.standing) + (rank ? '<span class="pill role-c">#' + rank + ' in the company</span>' : '') + '<span class="tiny muted">' + esc(dshort(S.start) + ' – ' + dshort(S.end)) + '</span></div>';
    document.getElementById('drawer').innerHTML = header + kp + wk + ter + acc;
    document.getElementById('drawer').classList.add('show'); document.getElementById('drawerBg').classList.add('show');
    document.body.style.overflow = 'hidden';
    return;
  }
  document.getElementById('drawer').innerHTML = header + kp + '<div class="grid2">' + wk + ter + '</div>' + acc;
  document.getElementById('drawer').classList.add('show'); document.getElementById('drawerBg').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeRep() { document.getElementById('drawer').classList.remove('show'); document.getElementById('drawerBg').classList.remove('show'); document.body.style.overflow = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeRep(); });

/* ---------- boot ---------- */
(function () {
  var r = monthRange(0); S.start = r.start; S.end = r.end;
  var h = (location.hash || '').replace('#', '');
  if (['overview', 'teams', 'reps'].indexOf(h) >= 0) S.view = h;
  document.querySelectorAll('.topnav [data-view], .tabbar [data-view]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === S.view); });
  load(false);
})();
</script>
